<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAMPLE_01 연습</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #1d2330; --muted: #6b7384; --line: #e2e5ea;
    --accent: #2459d6; --accent-soft: #e6edfc; --atc: #0f7a55; --atc-soft: #e3f4ec;
    --warn: #b4531c; --warn-soft: #fbeee5; --done: #2e8b57; --screen: #111827; --screen-text: #7df9c1;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151b; --card: #1b2029; --text: #e6e9ef; --muted: #939bab; --line: #2c3340;
      --accent: #6d9bff; --accent-soft: #1f2a44; --atc: #4fd19a; --atc-soft: #183229;
      --warn: #f09a62; --warn-soft: #3a2518; --done: #5fcf8c; --screen: #0a0d12; --screen-text: #7df9c1;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.6 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--line);
           padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
  header h1 { font-size: 17px; margin: 0; }
  header .home { color: var(--accent); text-decoration: none; font-size: 14px; white-space: nowrap; }
  header .mine { color: var(--accent); text-decoration: none; font-size: 13px; }
  header .progress { color: var(--muted); font-size: 13px; }
  header .opts { margin-left: auto; display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; }
  header label { cursor: pointer; user-select: none; }
  .layout { display: grid; grid-template-columns: 240px 1fr; gap: 16px; max-width: 1100px;
            margin: 16px auto; padding: 0 16px; }
  nav { align-self: start; position: sticky; top: 64px; background: var(--card); border: 1px solid var(--line);
        border-radius: 10px; padding: 10px; max-height: calc(100vh - 80px); overflow: auto; }
  nav .sec { font-size: 12px; font-weight: 600; color: var(--muted); margin: 8px 2px 4px; }
  nav .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  nav button { border: 1px solid var(--line); background: transparent; color: var(--text); border-radius: 6px;
               font-size: 12px; padding: 2px 7px; cursor: pointer; }
  nav button.answered { background: var(--accent-soft); border-color: var(--accent); }
  nav button.current { outline: 2px solid var(--accent); font-weight: 700; }
  main { min-width: 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
  .sec-title { font-size: 13px; color: var(--muted); font-weight: 600; }
  details.dir { margin: 6px 0 12px; font-size: 13px; color: var(--muted); }
  details.dir summary { cursor: pointer; }
  .qhead { display: flex; align-items: baseline; gap: 10px; margin: 8px 0 12px; }
  .qhead h2 { margin: 0; font-size: 22px; }
  .qhead .time { color: var(--muted); }
  .block { margin: 10px 0; }
  .seg { padding: 8px 12px; border-radius: 8px; margin: 6px 0; }
  .seg.narration { background: var(--bg); }
  .seg.instruction { background: var(--accent-soft); font-weight: 600; }
  .seg.atc { background: var(--atc-soft); }
  .seg.atc b { color: var(--atc); }
  .seg.hidden { color: var(--muted); font-style: italic; }
  .seg.playing { outline: 2px solid var(--accent); }
  .seg.chime { background: transparent; color: var(--muted); padding: 2px 12px; }
  /* 실제 응시 화면의 상단 하늘색 띠 */
  .cuebar { background: #e8f4fb; border: 1px solid #b9d9ee; border-bottom-width: 3px;
            border-radius: 6px; padding: 10px 14px; margin: 0 0 14px; }
  .cuebar .cue { color: #1a5fa8; font-weight: 700; }
  .cuebar .cue + .cue { margin-top: 4px; }
  .cuebar .tag { color: #c02626; font-weight: 700; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .cuebar { background: #10212e; border-color: #1f4a66; }
  }
  .screen { background: var(--screen); color: var(--screen-text); font-family: ui-monospace, Consolas, monospace;
            padding: 10px 14px; border-radius: 8px; margin: 8px 0; }
  .pre-label { font-size: 12px; color: var(--muted); font-weight: 600; margin-top: 4px; }
  img.fig { max-width: 100%; border-radius: 8px; border: 1px solid var(--line); background: #fff; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 16px 0 10px; }
  button.btn { border: 1px solid var(--line); background: var(--card); color: var(--text); padding: 8px 14px;
               border-radius: 8px; cursor: pointer; font-size: 14px; }
  button.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.btn:disabled { opacity: .45; cursor: default; }
  .timer { flex: 1; min-width: 160px; display: flex; align-items: center; gap: 8px; }
  .bar { flex: 1; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .2s linear; }
  .bar.low > div { background: var(--warn); }
  .timer span { font-variant-numeric: tabular-nums; min-width: 42px; text-align: right; }
  .status { font-size: 13px; color: var(--muted); min-height: 20px; }
  textarea { width: 100%; min-height: 90px; border: 1px solid var(--line); border-radius: 8px; padding: 10px;
             font: inherit; background: var(--bg); color: var(--text); resize: vertical; }
  .nokey { max-width: 1100px; margin: 12px auto 0; padding: 10px 14px; border-radius: 8px;
           background: var(--warn-soft); color: var(--warn); font-size: 13px; }
  .nokey .btn { padding: 5px 10px; font-size: 13px; margin-left: 4px; }
  .live { font-size: 13px; color: var(--accent); min-height: 19px; font-style: italic; margin: 4px 0; }
  .heard { margin: 8px 0; padding: 9px 12px; border-radius: 8px; background: var(--atc-soft);
           font-size: 14px; }
  .heard b { display: block; font-size: 11px; letter-spacing: .04em; color: var(--muted);
             margin-bottom: 3px; }
  .heard .use { margin-left: 8px; font-size: 12px; }
  .rec { margin: 8px 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; }
  .sent { font-size: 12px; color: var(--muted); }
  .sent.ok { color: var(--done); }
  .sent.bad { color: var(--warn); }
  .rec audio { height: 34px; }
  details.model { margin-top: 12px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
  details.model summary { cursor: pointer; font-weight: 600; color: var(--done); }
  .nav-row { display: flex; justify-content: space-between; margin-top: 16px; gap: 8px; }
  .footer { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 40px; }
  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
    nav { position: static; max-height: none; }
    header .opts { margin-left: 0; }
  }
</style>
</head>
<body>
<header>
  <a class="home" href="/">← 목록</a>
  <h1 id="title"></h1>
  <span class="progress" id="progress"></span>
  <div class="opts">
    <label><input type="checkbox" id="optScript"> 스크립트 보기</label>
    <label><input type="checkbox" id="optSpeech" checked> 음성 인식</label>
    <label><input type="checkbox" id="optAudio" checked> 녹음 저장</label>
    <label><input type="checkbox" id="optAutoStart"> 다음 문항 자동 시작</label>
    <a class="mine" id="mineLink" href="/r/">내 답안 보기 →</a>
  </div>
</header>

<p class="nokey" id="nokey" hidden>⚠ <b>서버 저장이 꺼져</b> 있습니다. 답안은 이 브라우저에만
   남습니다. <button class="btn" id="relogin">비밀번호 다시 입력</button></p>

<div class="layout">
  <nav id="nav"></nav>
  <main>
    <div class="card" id="card"></div>
    <div class="footer">
      <button class="btn" id="copyMd">답안 넣은 md 복사</button>
      <button class="btn" id="downloadMd">md 다운로드</button>
      <button class="btn" id="syncAll">모든 답안 서버로 저장</button>
      <button class="btn" id="reset">답안 초기화</button>
      <span class="status" id="footStatus"></span>
    </div>
  </main>
</div>

at happened to your aircraft (HL123)? Explain the nature of the incident.", "src": "/audio/SAMPLE_01/b55b0c790f9a94b5.mp3"}], "hints": ["Public", "Approach", "Descend", "Dixie", "ILS", "Fly", "Sovereign", "Independent", "Airport", "Turn", "What", "Hotel Lima one two three", "affirm", "negative", "unable", "wilco", "roger", "say again", "standby", "request", "readback", "squawk", "flight level", "heading", "altimeter", "knots", "Mach", "runway", "taxiway", "holding point", "hold short", "line up and wait", "cleared for takeoff", "cleared to land", "go around", "vectors", "troubleshooting", "souls on board", "minimum fuel", "mayday", "pan pan", "PIREP", "turbulence", "icing", "wake turbulence", "QNH", "ILS", "RNAV", "SID", "transition", "intercept", "localizer", "established", "expedite", "backtrack", "pushback", "start up", "deviation", "offset", "intentions", "descend", "climb", "maintain", "contact", "report", "due to performance", "due to weather", "clear of traffic", "in sight"]}, {"id": "P2C-Q2", "seconds": 90, "note": "", "pre": [], "body": [{"type": "say", "voice": "narrator", "kind": "narration", "text": "How do you think the incident was handled by the air traffic controller? Do you feel the situation could have been handled differently? Make a comment from a pilot's point of view.", "src": "/audio/SAMPLE_01/a0bd8a27f261ce2d.mp3"}], "hints": ["How", "Hotel Lima one two three", "affirm", "negative", "unable", "wilco", "roger", "say again", "standby", "request", "readback", "squawk", "flight level", "heading", "altimeter", "knots", "Mach", "runway", "taxiway", "holding point", "hold short", "line up and wait", "cleared for takeoff", "cleared to land", "go around", "vectors", "troubleshooting", "souls on board", "minimum fuel", "mayday", "pan pan", "PIREP", "turbulence", "icing", "wake turbulence", "QNH", "ILS", "RNAV", "SID", "transition", "intercept", "localizer", "established", "expedite", "backtrack", "pushback", "start up", "deviation", "offset", "intentions", "descend", "climb", "maintain", "contact", "report", "due to performance", "due to weather", "clear of traffic", "in sight"]}]}], "set": "SAMPLE_01", "raw": "# EPTA 공식 샘플세트 Ⅰ (실제 출제 음성 test01) — SAMPLE_01\n\n> 이 세트는 **창작한 세트가 아니라 한국교통안전공단 공식 샘플세트 Ⅰ** 의 실제 출제 음성\n> (`reference/transcripts/test01.txt`)을 그대로 옮긴 것이다. 개인 연습 용도로만 쓴다.\n> Part Ⅱ Task A 의 Q8·Q9 구간은 자막이 손상돼 있어 `reference/exam-spec.md` §4-3 의\n> 12턴 분석으로 ATC 대사를 복원했다 — 해당 문항에 표시해 두었다.\n\n안 내 메모 가능 / 문항당 1회 Say again 기능 사용 가능. 응시자 콜사인은 항상 **HL123**.\n\n---\n\n## Part Ⅰ TASK A. Readback and Hearback\n\n✅ Directions : You will be listening to 4 ATC instructions. Your callsign will be HL123.\nListen carefully and make a correct readback for each of them. \"Say again (=Repeat)\"\navailable once only. You may take notes while listening.\n  * Correct / Full readback : necessary for standard operating procedures\n  * Response time for each question : 20 seconds or less\n\n✅ 시험[응답] 요령\n\n| 항목 | 내용 |\n|---|---|\n| 구성 | 4문항 / 문항 별 응대시간 : 20초 |\n| 평가요소 | 기본적인 교신 능력 평가로 ATC의 지시사항에 맞게 표준교신용어로 readback |\n| 진행 | 관제사 지시 → 응답녹음 |\n| 평가항목 | 표준 교신속도/발음/억양의 사용 여부 · 필요한 정보의 효율적 전달 능력 평가 · 정확한 표준 교신용어의 사용 여부 · 관제 지시 후 교신 응대의 즉시성 여부 |\n| 유의사항 | 올바른 readback : 운항절차에 필요한 필수 사항을 모두 포함한 readback · 필수사항은 아니지만 지시사항을 전체 readback 해도 감점되지 않음 |\n\n**P1A-Q1** 🎙 20초\nATC : HL123, clear direct ATLAS.\n\nRecord your full readback.\n\n[정답]\n\n\n---\n\n**P1A-Q2** 🎙 20초\nATC : HL123, stop climb at flight level 260 due to traffic.\n\nRecord your full readback.\n\n[정답]\n\n\n---\n\n**P1A-Q3** 🎙 20초\nATC : HL123, caution wake turbulence, runway 32 cleared for takeoff.\n\nRecord your full readback.\n\n[정답]\n\n\n---\n\n**P1A-Q4** 🎙 20초\nATC : HL123, start up and pushback approved, long pushback, tail east until abeam gate 34.\n\nRecord your full readback.\n\n[정답]\n\n\n---\n\n## Part Ⅰ TASK B. Checking, Clarifying, Confirming, Informing\n\n✅ Directions : You will be listening to 6 audio clips, which consist of short situational\nprompts. Respond to each of them using mainly Standard Phraseology if possible. If not,\nyou may use plain English to help clarify your response. \"Say again (=Repeat)\" available\nonly once. Your callsign is HL123. You may take notes while listening.\n  * Response time for each question : 20 seconds or less\n\n✅ 시험[응답] 요령\n\n| 항목 | 내용 |\n|---|---|\n| 구성 | 6문항 / 문항 별 응대시간 : 20초 |\n| 평가요소 | 기본적인 교신 능력 평가로 ATC의 지시사항에 맞게 표준교신용어로 readback |\n| 진행 | 상황정보 제시 → 관제지시 → 응답녹음 |\n| 평가항목 | Task B는 상황정보 이해력 및 해당 교신에 대한 적절한 응대력 평가 · 상황정보 및 ATC의 교신에 따라 플레인 영어 사용이 요구될 수 있음 |\n| 유의사항 | 상황정보(prompt) 음성에는 교신용어가 플레인 영어(발음)로 들려질 수 있음. 필요 시 올바른 교신용어로 응답해야 함 |\n\n**P1B-Q1** 🎙 20초\nDuring your takeoff roll, you noticed bird activity at the end of the runway. Make a\nreport after airborne to ATC.\n\nATC : HL123, go ahead.\n\nRecord your response.\n\n[정답]\n\n\n---\n\n**P1B-Q2** 🎙 20초\nWhile maintaining flight level 310, you are at Mach 0.81, from previous ATC instructions.\nYou are also approaching the boundary of the FIR. Now ATC contacts you. Respond\naccordingly.\n\nATC : HL123, descend and maintain flight level 220. Contact Tokyo Control on 121.65.\nReport speed.\n\nRecord your response.\n\n[정답]\n\n\n---\n\n**P1B-Q3** 🎙 20초\nYou are cruising at flight level 210. You have encountered moderate turbulence for 3\nminutes with an altitude gain of around 200 feet. Now ATC contacts you. Respond\naccordingly.\n\nATC : HL123, request flight condition.\n\nRecord your response.\n\n[정답]\n\n\n---\n\n**P1B-Q4** 🎙 20초\nAfter becoming airborne, you contact Departure Control. ATC gives you climbing\nrestrictions to cross Johnson VOR, but you cannot comply due to performance reasons.\nAcknowledge and respond accordingly.\n\nATC : HL123, climb and maintain flight level 210. Cross Johnson VOR at or above flight\nlevel 150. If unable, maintain flight level 130 until Johnson VOR.\n\nRecord your response.\n\n[정답]\n\n\n---\n\n**P1B-Q5** 🎙 20초\nATC instructs you to make a 10-degree right turn for traffic separation. You misunderstood\nthe instruction and made a 10-degree left turn. Now ATC contacts you. Respond accordingly.\n\nATC : HL123, confirm maintaining 10 degrees to the right of your route?\n\nRecord your response.\n\n[정답]\n\n\n---\n\n**P1B-Q6** 🎙 20초\nDuring an en-route phase of the flight, you are instructed to pass FRISO at 0100 Zulu, but\nthe flight computer shows that, even at maximum speed, the aircraft will not cross FRISO\nuntil 0103 Zulu. Now ATC contacts you. Respond accordingly.\n\nATC : HL123, cross FRISO at or before 0100 Zulu.\n\nRecord your response.\n\n[정답]\n\n\n---\n\n## Part Ⅱ TASK A. Role-play & Follow-up\n\n✅ Directions : In Part 2 Task A, you will be going through a couple of flight situations\nof a normal passenger flight. Follow the prompts for providing your response, which you\nwill either hear or see on the screen, or the both. \"Say again (=Repeat)\" available once\nonly. Your callsign is HL123.\n\nAfter finishing Task A Role play, you will be asked one or two follow-up questions. You\nwill have up to 90 seconds to respond to them.\n\n✅ 시험[응답] 요령\n\n| 항목 | 내용 |\n|---|---|\n| 구성 | 약 7~12회 롤 플레이 / 응대시간 : 30초, Follow up : 90초 |\n| 평가요소 | 정상상황에서 기본 교신능력과 비정상 발생시 상황보고 또는 요구사항 전달 등에 필요한 언어 구사력(교신용어와 플레인 영어의 복합 사용) |\n| 진행 | 연속적인 비행 단계 또는 복합적인 상황의 롤 플레이. Initial Situation → continued → Situation update → continued |\n| 평가항목 | 음성 또는 화면에 제공되는 Text clue(🖥)를 이용하여 지시대로 응대하는 능력 · 상황정보 및 ATC의 교신에 따라 요구되는 플레인 영어 사용능력 · 표준 교신속도/발음/억양의 사용 여부 및 정보의 효율적 전달능력 평가 · 교신 응대력(Role-play)과 플레인 영어(Follow-up) 능력을 전체적으로 평가 |\n| 유의사항 | 교신상황은 시간제한 및 언어평가 목적에 따라 '인위적'일 수 있고, 상황 전개의 '비약'이 인정되므로 지시사항에 맞게 응답해야 함 · 응답 직전 '약간의' 준비시간은 용인됨. 다만 '매우' 늦은 응답 또는 무응답은 영향을 미침 |\n\nFlight Paths\nIn this scenario, you'll be the pilot flying Hotel Lima 123, which goes through three\nflight stages. Clearance, Apron, and Taxi.\n\nInitial Situation You are ready for clearance to Smith Airport. You may need to inquire\nabout additional information. 🔔(dingdong)\n\n**P2A-Q1** 🎙 30초\n☞ Contact Clearance Control and make a request.\n\n[정답]\n\n\n---\n\n**P2A-Q2** 🎙 30초\n☞ Listen to the controller's message. Advise that you are ready.\nATC : HL123, for route revision. Advise when you're ready to copy.\n\n[정답]\n\n\n---\n\n**P2A-Q3** 🎙 30초\n☞ Listen to the controller and give a full readback.\nATC : HL123, cleared to Smith Airport, HAPIE 3 departure. Expect fly runway heading until\nthe Smith 1.5 DME, and then a right turn heading 100 to HAPIE, then as filed. Maintain\n5,000. Expect flight level 350, 10 minutes after departure. Squawk 1766.\n\n[정답]\n\n\n---\n\n**P2A-Q4** 🎙 30초\n☞ Listen to the controller's message. Respond accordingly, and inquire how long it will\ntake.\nATC : HL123, readback is correct. Hold for release.\n\n[정답]\n\n\n---\n\nSituation Update You are ready for pushback and startup. You are at gate Alpha 89. You\nexperience a change in your plans. 🔔(dingdong)\n\n**P2A-Q5** 🎙 30초\n☞ Contact Apron and request pushback and startup.\n\n[정답]\n\n\n---\n\n**P2A-Q6** 🎙 30초\n☞ Listen to the controller's response and give a full readback.\nATC : HL123, cleared pushback and startup. And once the tug crew gets you established on\nlane Alpha, if they can just pull you forward so I can push behind you at gate 87, I'd\nappreciate it.\n\n[정답]\n\n\n---\n\nSituation Update You are still on the apron and realize that you have too much fuel. You\nwill need to burn some off, or possibly defuel if able. 🔔(dingdong)\n\n**P2A-Q7** 🎙 30초\n☞ Contact Apron, report the problem, and request what you need.\n\n[정답]\n\n\n---\n\n**P2A-Q8** 🎙 30초\n☞ Listen to the controller's message and respond accordingly.\nATC : HL123, roger. How long will that take? *(자막 손상 구간 — exam-spec §4-3 복원)*\n\n[정답]\n\n\n---\n\n**P2A-Q9** 🎙 30초\n☞ Listen to the controller's message and respond accordingly.\nATC : HL123, defueling is not available here, and we are looking at about a 30-minute hold\nfor you. *(자막 손상 구간 — exam-spec §4-3 복원)*\n\n[정답]\n\n\n---\n\nSituation Update You have burnt off your extra fuel and are now holding short of Golf with\ninformation Alpha. There may be an alteration to your taxi route. 🔔(dingdong)\n\n**P2A-Q10** 🎙 30초\n☞ Contact Ground and request to taxi.\n\n[정답]\n\n\n---\n\n**P2A-Q11** 🎙 30초\n☞ Listen to the controller's response and give a full readback.\nGround : HL123, Ground, runway 13 left, taxi left on Golf, cross runway 22 right, follow\nthe Gulfstream passing left to right.\n\n[정답]\n\n\n---\n\n**P2A-Q12** 🎙 30초\n☞ Listen to the controller's message. Respond accordingly and request assistance.\nGround : HL123, it appears the Gulfstream blew a tire. Are you able to continue straight on\nGolf 2, then left on Hotel?\n\n[정답]\n\n\n---\n\n**P2A-Q13** 🎙 90초 (Follow-up)\nYou have just finished Task A, as the pilot of Hotel Lima one two three.\n\nIn this situation, what problem did you discover while on the ramp, and how did you\nresolve that problem?\n\n[정답]\n\n\n\n\n---\n\n## Part Ⅱ TASK B. Extended Role-play : Single Incident/Emergency Related\n\n✅ Directions : You will be interacting with an Air traffic controller or Ground crew\nbased on short situational prompts. Follow the prompts and respond as necessary. Assume\nyou can accept all the instructions, unless being specified otherwise. \"Say again\n(=Repeat)\" available only once. Your callsign is HL123.\n  * Response time for each question : 30 seconds or less\n\n✅ 시험[응답] 요령 ※ Task B의 교신내용이 Task C의 태스크와 연계되므로, 관련 정보의 메모가 필요\n\n| 항목 | 내용 |\n|---|---|\n| 구성 | 약 7~12회 롤 플레이 / 응대시간 : 30초 |\n| 평가요소 | 단일 상황에서 비정상/비상상황에서 문제를 해결과정에서의 상황보고 또는 의사전달능력 등에 필요한 언어 구사력(플레인 영어의 빈도가 높아짐) |\n| 진행 | 비정상 또는 비상 상황이 포함된 '단일'사건의 롤 플레이. Initial Situation → continued → Situation update → continued |\n| 평가항목 | 음성 또는 화면에 제공되는 Text clue(🖥)를 이용하여 지시대로 응대하는 능력 · 상황정보 및 ATC의 내용에 따라 요구되는 교신용어 또는 플레인 영어 사용 능력 · 표준 교신속도/발음/억양의 사용 여부 및 정보의 효율적 전달능력 평가 · 교신 응대력(Role-play)과 플레인 영어능력을 전체적으로 평가 |\n| 유의사항 | 교신상황은 시간제한 및 언어평가 목적에 따라 '인위적'일 수 있고, 상황 전개의 '비약'이 인정되므로 지시사항에 맞게 응답해야 함 · 응답 직전 '약간의' 준비시간은 용인됨. 다만 '매우' 늦은 응답 또는 무응답은 영향을 미침 · 플레인 영어 사용 빈도가 다소 높을 수 있고, 응대 내용의 정확도 및 유창도에 따라 Operational(Level4)과 Extended(Level5) 여부가 평가됨 |\n\nInitial Situation You are the pilot of HL123, currently descending through flight level 180\nto 11,000, approaching Public Airport. You have ATIS information Oscar. 🔔(dingdong)\n\n**P2B-Q1** 🎙 30초\n☞ Contact Public Approach and report your position.\n\n[정답]\n\n\n---\n\n**P2B-Q2** 🎙 30초\n☞ Listen to the controller's response and respond accordingly.\nApproach : HL123, Public Approach, good afternoon. Descend and maintain 6,000, reduce speed\nto 210 and expect Dixie 1 arrival runway 23 transition, followed by ILS 23.\n\n[정답]\n\n\n---\n\nSituation Update While descending and preparing for the approach, you have noticed that\nyou have lost a lot of your instrument displays. The controller contacts you.\n🔔(dingdong)\n\n**P2B-Q3** 🎙 30초\n☞ Respond accordingly, stating you're levelling off at 4,000. Inform them of your\nsituation and request vectors for holding.\nApproach : HL123, turn right heading 190, descend and maintain 4,000 to intercept the\nrunway 23 localizer.\n\n[정답]\n\n\n---\n\n**P2B-Q4** 🎙 30초\n☞ Respond and give a full readback, and request weather information for Sovereign and\nIndependent airports. You prefer VMC conditions.\nApproach : HL123, roger. Fly heading 270, maintain 4,000, and say intentions.\n\n[정답]\n\n\n---\n\n**P2B-Q5** 🎙 30초\n☞ Request vectors to Independent Airport for a visual approach.\nApproach : HL123, Sovereign weather, wind 350 at 6, visibility 1 mile with ceiling 3,000\novercast, temperature 10, dewpoint 9. Independent looks better — wind 170 at 5, visibility\n10, ceiling 2,200 broken, temperature 16, dewpoint 12.\n\n[정답]\n\n\n---\n\nSituation Update As you start your turn towards Independent Airport, you get some\ninstruments back that will allow you to shoot the ILS approach at Public Airport.\n🔔(dingdong)\n\n**P2B-Q6** 🎙 30초\n☞ Contact Approach Control to give them an update of your situation, and request ILS 23 at\nPublic Airport.\n\n[정답]\n\n\n---\n\n**P2B-Q7** 🎙 30초\n☞ Respond and give a full readback. Advise approach to stand by for further information.\nApproach : HL123, roger. You're cleared to Public Airport. Turn right heading 140 and\nmaintain 4,000. And let me know if anything changes.\n\n[정답]\n\n\n---\n\n## Part Ⅱ TASK C. Reporting about Task B\n\n✅ Directions : You have just finished Part 2 Task B. Now you will be listening to the\nATC's radiotelephony messages to better recall the events. Afterwards, you will be\nasked two questions about the situation. You will have 90 seconds for each question.\n\n✅ 시험[응답] 요령\n\n| 항목 | 내용 |\n|---|---|\n| 구성 | 2문항 / 응대시간 : 90초 |\n| 평가요소 | Task B에서 수행한 롤 플레이 내용에 대한 리포팅(플레인 영어) 능력 |\n| 진행 | TASK B의 ATC 교신 내용 다시 듣기 → 질문 → 응답하기 |\n| 평가항목 | 구체적인 사건과 상황 전개의 내용을 묻는 질문(Q1)에 대한 사실전달 능력 · 사건에 대한 이해를 바탕으로 의견을 묻는 질문(Q2)에 대한 의견제시 능력 |\n| 유의사항 | 제공시간을 최대한 활용하여 평가항목(유창성, 이해력, 어휘, 발음, 문장구조)에 대한 능력을 충분히 표현 · 경험 사례 또는 관련 지식/보도 등을 활용하여 플레인 영어능력을 최대로 발휘 |\n\n☞ Now listen to the controller's radiotelephony messages.\n\nATC: HL123, Public Approach, good afternoon. Descend and maintain 6,000, reduce speed to\n210 and expect Dixie 1 arrival runway 23 transition, followed by ILS 23.\nATC: HL123, turn right heading 190, descend and maintain 4,000 to intercept the runway 23\nlocalizer.\nATC: HL123, roger. Fly heading 270, maintain 4,000, and say intentions.\nATC: HL123, Sovereign weather, wind 350 at 6, visibility 1 mile with ceiling 3,000\novercast, temperature 10, dewpoint 9. Independent looks better — wind 170 at 5, visibility\n10, ceiling 2,200 broken, temperature 16, dewpoint 12.\nATC: HL123, roger. You're cleared to Public Airport. Turn right heading 140 and maintain\n4,000. And let me know if anything changes. 🔔(dingdong)\n\n☞ Now answer the questions.\n\n**P2C-Q1** 🎙 90초\nWhat happened to your aircraft (HL123)? Explain the nature of the incident.\n\n[정답]\n\n\n\n\n---\n\n**P2C-Q2** 🎙 90초\nHow do you think the incident was handled by the air traffic controller? Do you feel the\nsituation could have been handled differently? Make a comment from a pilot's point of\nview.\n\n[정답]\n\n\n\n\n---\n", "answers": {}}</script>
<script>
(() => {
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const KEY = 'epta:' + DATA.set;
  const PAUSE_MS = 600;

  const flat = [];
  DATA.sections.forEach((sec, si) => sec.questions.forEach((q, qi) => flat.push({ ...q, si, first: qi === 0 })));

  const store = {
    get(name, fallback) {
      try { return JSON.parse(localStorage.getItem(KEY + ':' + name)) ?? fallback; } catch { return fallback; }
    },
    set(name, value) { try { localStorage.setItem(KEY + ':' + name, JSON.stringify(value)); } catch {} },
  };

  const answers = store.get('answers', {});
  const sayAgainUsed = store.get('sayagain', {});
  const recordings = {};                 // id → blob URL (이 탭에서만)
  const opts = store.get('opts', { script: false, speech: true, audio: true, autoStart: false });
  // 녹음이 기본 꺼짐이던 때 저장된 설정을 한 번만 켜준다
  if (!store.get('optsV2', false)) {
    opts.audio = true; opts.speech = true;
    store.set('opts', opts); store.set('optsV2', true);
  }

  function stamp() {
    const d = new Date(), z = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}${z(d.getMonth() + 1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}`;
  }

  // 응시 세션 — 서버에 이 묶음으로 저장된다. '답안 초기화' 하면 새 세션이 열린다.
  let session = store.get('session', '');
  if (!session) { session = stamp(); store.set('session', session); }

  // 서버 비밀키는 들어올 때 비밀번호를 확인한 서버가 내려준다 (gate.js → /api/login).
  // HTML 소스에도, 주소에도 들어가지 않는다.
  let token = '';

  let idx = Math.min(store.get('idx', 0), flat.length - 1);
  let phase = 'idle';                    // idle | playing | answering | done
  let revealed = false;
  let runId = 0;                         // 재생·타이머 취소용
  let timerHandle = null;
  let recorder = null, micStream = null;
  let recog = null, recogFinal = '', recogBase = '';
  let recStop = null;                    // 녹음 마무리를 기다리는 약속
  let speechStarted = false;             // 인식이 실제로 시작됐는지
  let speechError = '';                  // 인식이 실패한 이유
  const sent = {};                       // id → 전송 상태 문자열
  const lastSent = {};                   // id → 서버로 보낸 마지막 글자
  const heard = {};                      // id → 서버가 녹음에서 알아들은 글자
  const sentAudio = {};                  // id → 녹음까지 보냈는지
  let typeTimer = null;

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  /* ───────── 소리 ───────── */

  const player = new Audio();
  let actx = null;
  const ctx = () => (actx ??= new (window.AudioContext || window.webkitAudioContext)());

  function tone(freq, start, dur, gain = 0.25) {
    const c = ctx(), o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(gain, c.currentTime + start);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + start + dur);
    o.connect(g).connect(c.destination);
    o.start(c.currentTime + start); o.stop(c.currentTime + start + dur);
  }
  const chime = () => { tone(784, 0, 0.9); tone(622, 0.45, 1.1); return wait(1600); };
  const beep = () => { tone(1000, 0, 0.35, 0.2); };
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  function playSrc(src) {
    return new Promise((resolve, reject) => {
      player.src = src;
      player.onended = resolve;
      player.onerror = () => reject(new Error('음성 파일을 열 수 없습니다: ' + src));
      player.play().catch(reject);
    });
  }

  async function playSegments(segs, my) {
    for (const seg of segs) {
      if (my !== runId) return false;
      if (seg.type === 'chime') { await chime(); continue; }
      if (seg.type !== 'say') continue;
      const el = document.querySelector(`[data-src="${seg.src}"]`);
      el?.classList.add('playing');
      try { await playSrc(seg.src); } finally { el?.classList.remove('playing'); }
      if (my !== runId) return false;
      await wait(PAUSE_MS);
    }
    return my === runId;
  }

  function stopAll() {
    runId++;
    player.pause();
    clearInterval(timerHandle);
    stopSpeech();
    stopRecording();
  }

  /* ───────── 음성 인식 — 말하면 바로 글자로 ───────── */

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  function startSpeech(id) {
    if (!opts.speech) return;
    if (!SR) { setStatus('이 브라우저는 음성 인식을 지원하지 않습니다 — 타이핑으로 답하세요.'); return; }

    recogBase = (answers[id] || '').trim();   // 이미 적어둔 내용은 보존하고 뒤에 붙인다
    recogFinal = '';
    speechStarted = false;
    speechError = '';
    const r = new SR();
    recog = r;
    r.lang = 'en-US';
    r.continuous = true;
    r.interimResults = true;
    r.maxAlternatives = 1;

    r.onresult = (e) => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const txt = e.results[i][0].transcript.trim();
        if (e.results[i].isFinal) { if (txt) recogFinal += (recogFinal ? ' ' : '') + txt; }
        else interim += txt + ' ';
      }
      const merged = [recogBase, recogFinal].filter(Boolean).join(' ');
      answers[id] = merged;
      store.set('answers', answers);
      const ta = $('answer'); if (ta) ta.value = merged;
      const lv = $('live'); if (lv) lv.textContent = interim ? '… ' + interim : '';
    };

    r.onstart = () => { speechStarted = true; };

    r.onerror = (e) => {
      const why = {
        'not-allowed': '마이크 권한이 거부되었습니다',
        'service-not-allowed': '브라우저가 음성 인식을 막았습니다',
        'network': '음성 인식 서버에 연결할 수 없습니다',
        'audio-capture': '마이크를 잡을 수 없습니다 (녹음과 충돌했을 수 있습니다)',
        'aborted': '',
        'no-speech': '',
      }[e.error] ?? `음성 인식 오류 (${e.error})`;
      if (why) { speechError = why; setStatus(why + ' — 타이핑으로 답하세요.'); }
    };

    // 안드로이드 크롬은 잠깐 조용하면 알아서 끊긴다. 응답시간 동안은 계속 되살린다.
    r.onend = () => { if (recog === r && phase === 'answering') { try { r.start(); } catch {} } };

    try { r.start(); } catch { recog = null; }
  }

  function stopSpeech() {
    const r = recog;
    if (!r) return;
    recog = null;
    r.onend = null;
    try { r.stop(); } catch {}
    const lv = $('live'); if (lv) lv.textContent = '';
  }

  /* ───────── 녹음 (선택 — 나중에 다시 들어보려면) ───────── */

  async function startRecording(id) {
    recStop = null;
    if (!opts.audio) return;
    if (!window.MediaRecorder || !navigator.mediaDevices?.getUserMedia) {
      setStatus('이 브라우저는 녹음을 지원하지 않습니다 — 답안은 글자로만 저장됩니다.');
      return;
    }
    try {
      micStream ??= await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch {
      setStatus('마이크 권한이 없어 녹음을 못 합니다 — 답안은 글자로만 저장됩니다.');
      return;
    }

    // ★ recorder 를 지역 변수로 붙잡는다. 전역만 쓰면 stop 뒤에 null 이 되어
    //   onstop 안에서 터지고 녹음 파일이 만들어지지 않는다.
    let rec;
    try { rec = new MediaRecorder(micStream); }
    catch { setStatus('녹음을 시작할 수 없습니다 — 답안은 글자로만 저장됩니다.'); return; }

    const chunks = [];
    recorder = rec;
    recStop = new Promise((resolve) => {
      rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
      rec.onerror = () => { setStatus('녹음 중 오류가 났습니다 — 글자만 저장됩니다.'); resolve(); };
      rec.onstop = () => {
        if (chunks.length) {
          if (recordings[id]) URL.revokeObjectURL(recordings[id].url);
          const blob = new Blob(chunks, { type: rec.mimeType || 'audio/webm' });
          recordings[id] = { blob, url: URL.createObjectURL(blob) };
          if (flat[idx].id === id) renderRecording();
        }
        resolve();
      };
    });
    try { rec.start(); } catch { recorder = null; recStop = null; }
  }

  function stopRecording() {
    const rec = recorder;
    recorder = null;
    if (rec && rec.state !== 'inactive') rec.stop();
    else recStop = null;
  }

  /* ───────── 진행 ───────── */

  async function start() {
    const q = flat[idx];
    stopAll();
    const my = runId;
    phase = 'playing'; render();
    setStatus('듣는 중…');
    try {
      if (!(await playSegments(q.pre, my))) return;
      if (!(await playSegments(q.body, my))) return;
    } catch (e) { setStatus(e.message); phase = 'idle'; render(); return; }
    answer(my);
  }

  async function sayAgain() {
    const q = flat[idx];
    if (sayAgainUsed[q.id]) return;
    sayAgainUsed[q.id] = true; store.set('sayagain', sayAgainUsed);
    stopAll();
    const my = runId;
    phase = 'playing'; render();
    setStatus('Say again — 다시 듣는 중…');
    try {
      if (!(await playSegments(q.body, my))) return;
    } catch (e) { setStatus(e.message); phase = 'idle'; render(); return; }
    answer(my);
  }

  function answer(my) {
    const q = flat[idx];
    phase = 'answering'; render();
    setStatus((opts.speech ? '응답하세요 — 말하면 글자로 들어갑니다' : '응답하세요 — 타이핑')
      + (opts.audio ? ' · 녹음 중' : ''));
    // 인식이 마이크를 먼저 잡게 하고, 녹음을 뒤에 붙인다 (동시에 열면 인식이 밀린다)
    startSpeech(q.id);
    setTimeout(() => { if (my === runId) startRecording(q.id); }, 400);
    const total = q.seconds * 1000, t0 = Date.now();
    const tick = () => {
      if (my !== runId) return;
      const left = Math.max(0, total - (Date.now() - t0));
      setTimer(left / 1000, q.seconds);
      if (left <= 0) finish(true);
    };
    tick();
    timerHandle = setInterval(tick, 200);
  }

  async function finish(timeUp) {
    const q = flat[idx];
    stopAll();
    if (timeUp) beep();
    phase = 'done'; revealed = true;
    render();
    setStatus(timeUp ? '시간 종료' : '응답 종료');

    // 녹음 파일이 다 만들어질 때까지 기다린다 (최대 3초)
    const pending = recStop;
    recStop = null;
    if (pending) await Promise.race([pending, wait(3000)]);
    // 음성 인식의 마지막 조각이 들어올 시간
    await wait(400);

    if (opts.speech && !recogFinal.trim()) {
      setStatus(
        speechError ? `${speechError} — 답안이 비었습니다. 타이핑해 주세요.`
        : !SR ? '이 브라우저는 음성 인식을 지원하지 않습니다 — 타이핑해 주세요.'
        : !speechStarted ? '음성 인식이 시작되지 않았습니다 — 녹음 저장을 끄고 다시 해보세요.'
        : '음성 인식이 아무 말도 못 들었습니다 — 마이크에 가까이, 또는 타이핑해 주세요.');
    }
    submit(q);
  }

  /* ───────── 서버 전송 ───────── */

  // 아직 서버에 안 보낸 내용이 있는지
  function dirty(id) {
    const text = (answers[id] || '').trim();
    if (text && text !== lastSent[id]) return true;
    return !!(recordings[id]?.blob && !sentAudio[id]);
  }

  async function submit(q, { keepalive = false } = {}) {
    if (!token) return false;           // 주소에 #k=... 가 없으면 로컬에만 남는다
    if (!dirty(q.id)) return true;      // 이미 보낸 그대로면 다시 보내지 않는다

    const text = (answers[q.id] || '').trim();
    const blob = sentAudio[q.id] ? null : recordings[q.id]?.blob;
    if (!text && !blob) return true;

    sent[q.id] = '보내는 중…'; renderSent();
    const body = {
      set: DATA.set, session, qid: q.id,
      answer: text, seconds: q.seconds, hints: q.hints || [],
    };
    // 페이지가 닫히는 중이면 녹음은 포기하고 글자만 확실히 보낸다
    if (blob && !keepalive) {
      body.mime = blob.type || 'audio/webm';
      body.audio = await toBase64(blob);
    }
    try {
      const r = await fetch('/api/submit', {
        method: 'POST',
        headers: { 'content-type': 'application/json', 'x-epta-token': token },
        body: JSON.stringify(body),
        keepalive,
      });
      const j = await r.json().catch(() => ({}));
      if (r.ok) {
        lastSent[q.id] = text;
        if (body.audio) sentAudio[q.id] = true;
        sent[q.id] = body.audio ? '저장됨 · 녹음 포함' : '저장됨';

        const said = (j.transcript || '').trim();
        if (said) {
          heard[q.id] = said;
          // 답안칸이 비어 있으면 서버가 알아들은 것으로 채운다
          if (!text) {
            answers[q.id] = said;
            lastSent[q.id] = said;       // 방금 서버에서 온 것이니 다시 보낼 필요 없다
            store.set('answers', answers);
            if (flat[idx].id === q.id) { const ta = $('answer'); if (ta) ta.value = said; }
            renderNav();
          }
          if (flat[idx].id === q.id) renderHeard();
        }
        if (j.sttError && flat[idx].id === q.id) {
          setStatus('녹음은 저장됐지만 서버 전사에 실패했습니다: ' + j.sttError);
        }
      } else {
        sent[q.id] = `저장 실패 (${j.error || r.status})`;
      }
      renderSent();
      return r.ok;
    } catch {
      sent[q.id] = '저장 실패 — 네트워크';
      renderSent();
      return false;
    }
  }

  // 타이핑이 멈추면 조금 뒤에 저장한다
  function queueSubmit(q) {
    clearTimeout(typeTimer);
    typeTimer = setTimeout(() => submit(q), 1500);
  }

  // 남은 것 전부 — 화면을 떠날 때, 그리고 버튼을 눌렀을 때
  async function flushAll(opts2 = {}) {
    const todo = flat.filter((q) => dirty(q.id));
    if (!todo.length) return { ok: 0, fail: 0, todo: 0 };
    let ok = 0;
    for (const q of todo) ok += (await submit(q, opts2)) ? 1 : 0;
    return { ok, fail: todo.length - ok, todo: todo.length };
  }

  function toBase64(blob) {
    return new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onload = () => resolve(String(fr.result).split(',')[1]);
      fr.onerror = reject;
      fr.readAsDataURL(blob);
    });
  }

  function renderHeard() {
    const box = $('heard'); if (!box) return;
    const said = heard[flat[idx].id];
    if (!said) { box.innerHTML = ''; return; }
    const same = said === (answers[flat[idx].id] || '').trim();
    box.innerHTML = `<b>녹음에서 알아들은 말 (서버)</b>${esc(said)}`
      + (same ? '' : `<button class="btn use" id="useHeard">이걸 답안으로</button>`);
    $('useHeard')?.addEventListener('click', () => {
      const q = flat[idx];
      answers[q.id] = said;
      store.set('answers', answers);
      const ta = $('answer'); if (ta) ta.value = said;
      renderNav(); renderHeard();
      submit(q);
    });
  }

  function renderSent() {
    const el = $('sent'); if (!el) return;
    const s = sent[flat[idx].id] || '';
    el.textContent = s;
    el.className = 'sent' + (s.startsWith('저장됨') ? ' ok' : s.startsWith('저장 실패') ? ' bad' : '');
  }

  function go(to) {
    if (to < 0 || to >= flat.length) return;
    clearTimeout(typeTimer);
    submit(flat[idx]);                  // 떠나기 전에 지금 문항을 저장한다
    stopAll();
    idx = to; store.set('idx', idx);
    phase = 'idle'; revealed = false;
    render();
    window.scrollTo({ top: 0 });
    if (opts.autoStart) start();
  }

  /* ───────── 화면 ───────── */

  function segHtml(seg) {
    const show = opts.script || revealed;
    if (seg.type === 'chime') return `<div class="seg chime">🔔 dingdong</div>`;
    if (seg.type === 'screen') return `<div class="cue">☞ ${esc(seg.text)}</div>`;
    if (seg.type === 'image') return `<img class="fig" src="${esc(seg.src)}" alt="">`;
    if (seg.kind === 'instruction') return `<div class="seg instruction" data-src="${seg.src}">☞ ${esc(seg.text)}</div>`;
    if (seg.voice === 'atc') {
      return show
        ? `<div class="seg atc" data-src="${seg.src}"><b>${esc(seg.label)} :</b> ${esc(seg.text)}</div>`
        : `<div class="seg atc hidden" data-src="${seg.src}"><b>${esc(seg.label)} :</b> 🔊 (음성)</div>`;
    }
    const tag = /^(Flight Paths|Initial Situation|Situation Update)\.?\s*/.exec(seg.text || '');
    const body = tag ? seg.text.slice(tag[0].length) : (seg.text || '');
    const head = tag ? `<span class="tag">[${esc(tag[1])}]</span> ` : '';
    return show
      ? `<div class="seg narration" data-src="${seg.src}">${head}${esc(body)}</div>`
      : `<div class="seg narration hidden" data-src="${seg.src}">🔊 상황 설명 (음성)</div>`;
  }

  function render() {
    const q = flat[idx], sec = DATA.sections[q.si];
    const model = (DATA.answers || {})[q.id];
    const used = !!sayAgainUsed[q.id];

    $('title').textContent = DATA.set;
    $('progress').textContent = `${idx + 1} / ${flat.length}`;

    // 실제 시험처럼 화면 클루(☞)는 본문에서 빼서 맨 위 띠에 모아 보여준다
    const isCue = (s) => s.type === 'screen';
    const cues = [...q.pre, ...q.body].filter(isCue);
    const pre = q.pre.filter((s) => !isCue(s));
    const body = q.body.filter((s) => !isCue(s));

    $('card').innerHTML = `
      <div class="sec-title">${esc(sec.title)}</div>
      ${q.first && sec.directions ? `<details class="dir"${phase === 'idle' ? ' open' : ''}><summary>Directions</summary>${esc(sec.directions)}</details>` : ''}
      ${cues.length ? `<div class="cuebar">${cues.map(segHtml).join('')}</div>` : ''}
      ${pre.length ? `<div class="pre-label">SITUATION</div><div class="block">${pre.map(segHtml).join('')}</div>` : ''}
      <div class="qhead"><h2>${esc(q.id)}</h2><span class="time">🎙 ${q.seconds}초 ${esc(q.note)}</span></div>
      <div class="block">${body.map(segHtml).join('')}</div>

      <div class="controls">
        ${phase === 'playing' || phase === 'answering'
          ? `<button class="btn" id="stop">■ ${phase === 'answering' ? '응답 끝' : '멈춤'}</button>`
          : `<button class="btn primary" id="start">▶ ${phase === 'done' ? '처음부터 다시' : '시작'}</button>`}
        <button class="btn" id="again" ${used || phase === 'idle' || phase === 'playing' ? 'disabled' : ''}>Say again ${used ? '(사용함)' : '(1회)'}</button>
        <div class="timer"><div class="bar" id="bar"><div></div></div><span id="left">${q.seconds}s</span></div>
      </div>
      <div class="status" id="status"></div>

      <textarea id="answer" placeholder="말하면 여기에 바로 들어옵니다. 말할 수 없는 상황이면 직접 타이핑하세요.">${esc(answers[q.id] || '')}</textarea>
      <div class="live" id="live"></div>
      <div class="heard" id="heard"></div>
      <div class="rec" id="rec"></div>

      ${model ? `<details class="model"><summary>모범답안 보기</summary>${esc(model)}</details>` : ''}

      <div class="nav-row">
        <button class="btn" id="prev" ${idx === 0 ? 'disabled' : ''}>← 이전</button>
        <button class="btn" id="next" ${idx === flat.length - 1 ? 'disabled' : ''}>다음 →</button>
      </div>`;

    $('start')?.addEventListener('click', start);
    $('stop')?.addEventListener('click', () => (phase === 'answering' ? finish(false) : (stopAll(), phase = 'idle', render())));
    $('again').addEventListener('click', sayAgain);
    $('prev').addEventListener('click', () => go(idx - 1));
    $('next').addEventListener('click', () => go(idx + 1));
    $('answer').addEventListener('input', (e) => {
      answers[q.id] = e.target.value; store.set('answers', answers); renderNav();
      queueSubmit(q);
    });
    renderRecording();
    renderHeard();
    renderNav();
  }


  function renderRecording() {
    const rec = recordings[flat[idx].id];
    const box = $('rec'); if (!box) return;
    box.innerHTML = (rec
      ? `내 녹음 <audio controls src="${rec.url}"></audio> <a href="${rec.url}" download="${DATA.set}_${flat[idx].id}.webm">저장</a> `
      : '') + `<span class="sent" id="sent"></span>`;
    renderSent();
  }

  function renderNav() {
    let html = '', lastSec = -1;
    flat.forEach((q, i) => {
      if (q.si !== lastSec) {
        if (lastSec !== -1) html += '</div>';
        html += `<div class="sec">${esc(DATA.sections[q.si].title.replace(/\..*$/, ''))}</div><div class="chips">`;
        lastSec = q.si;
      }
      const cls = [(answers[q.id] || '').trim() ? 'answered' : '', i === idx ? 'current' : ''].join(' ');
      html += `<button class="${cls}" data-i="${i}">${esc(q.id.split('-')[1])}</button>`;
    });
    $('nav').innerHTML = html + '</div>';
    $('nav').querySelectorAll('button').forEach((b) => b.addEventListener('click', () => go(+b.dataset.i)));
  }

  function setTimer(left, total) {
    const bar = $('bar'); if (!bar) return;
    bar.firstElementChild.style.width = `${(1 - left / total) * 100}%`;
    bar.classList.toggle('low', left <= 5);
    $('left').textContent = `${Math.ceil(left)}s`;
  }
  const setStatus = (msg) => { const s = $('status'); if (s) s.textContent = msg; };

  /* ───────── md 내보내기 ───────── */

  function filledMarkdown() {
    const out = [];
    let cur = null, skipping = false;
    for (const line of DATA.raw.split(/\r?\n/)) {
      const m = line.trim().match(/^\*\*(P\d[ABC]-Q\d+)\*\*/);
      if (m) cur = m[1];
      if (skipping) {
        if (line.trim() === '---') { out.push('', line); skipping = false; }
        continue;
      }
      out.push(line);
      if (line.trim() === '[정답]' && cur && (answers[cur] || '').trim()) {
        out.push(answers[cur].trim());
        skipping = true;
      }
    }
    return out.join('\n');
  }

  $('copyMd').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(filledMarkdown()); $('footStatus').textContent = '복사했습니다.'; }
    catch { $('footStatus').textContent = '복사 실패 — md 다운로드를 쓰세요.'; }
  });
  $('downloadMd').addEventListener('click', () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([filledMarkdown()], { type: 'text/markdown' }));
    a.download = `${DATA.set}.md`;
    a.click();
  });
  $('reset').addEventListener('click', () => {
    if (!confirm('이 세트의 답안과 Say again 기록을 지울까요?')) return;
    for (const k of Object.keys(answers)) delete answers[k];
    for (const k of Object.keys(sayAgainUsed)) delete sayAgainUsed[k];
    for (const k of Object.keys(sent)) delete sent[k];
    store.set('answers', answers); store.set('sayagain', sayAgainUsed);
    session = stamp(); store.set('session', session);
    go(0);
  });

  /* ───────── 이탈 시 저장 ───────── */

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { clearTimeout(typeTimer); flushAll({ keepalive: true }); }
  });
  window.addEventListener('pagehide', () => {
    clearTimeout(typeTimer); flushAll({ keepalive: true });
  });

  $('syncAll').addEventListener('click', async () => {
    if (!token) {
      $('footStatus').textContent = '비밀키가 없어 서버로 못 보냅니다 — md 다운로드를 쓰세요.';
      return;
    }
    clearTimeout(typeTimer);
    $('footStatus').textContent = '보내는 중…';
    const { ok, fail, todo } = await flushAll();
    $('footStatus').textContent = todo === 0
      ? '보낼 것이 없습니다 (모두 저장됨).'
      : `${ok}문항 저장${fail ? `, ${fail}문항 실패` : ''}`;
  });

  function showKeyState() {
    $('nokey').hidden = !!token;
  }
  showKeyState();
  $('mineLink').href = '/r/?set=' + encodeURIComponent(DATA.set);

  $('relogin').addEventListener('click', () => {
    window.eptaForget();
    window.eptaGate((tok) => {
      token = tok;
      showKeyState();
      $('footStatus').textContent = '로그인했습니다. 이제 서버로 보낼 수 있습니다.';
      flushAll();                       // 그동안 못 보낸 답안을 올린다
    });
  });

  // 들어올 때 비밀번호를 확인하고 키를 받는다
  window.eptaGate((tok) => {
    token = tok;
    showKeyState();
    flushAll();                         // 로컬에만 남아 있던 답안이 있으면 올린다
  });

  /* ───────── 옵션 ───────── */

  const bindOpt = (id, name) => {
    $(id).checked = opts[name];
    $(id).addEventListener('change', (e) => { opts[name] = e.target.checked; store.set('opts', opts); render(); });
  };
  bindOpt('optScript', 'script');
  bindOpt('optSpeech', 'speech');
  bindOpt('optAudio', 'audio');
  bindOpt('optAutoStart', 'autoStart');

  render();
})();
</script>
</body>
</html>
