<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WEAK_02 연습</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #1d2330; --muted: #6b7384; --line: #e2e5ea;
    --accent: #2459d6; --accent-soft: #e6edfc; --atc: #0f7a55; --atc-soft: #e3f4ec;
    --warn: #b4531c; --warn-soft: #fbeee5; --done: #2e8b57; --screen: #111827; --screen-text: #7df9c1;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151b; --card: #1b2029; --text: #e6e9ef; --muted: #939bab; --line: #2c3340;
      --accent: #6d9bff; --accent-soft: #1f2a44; --atc: #4fd19a; --atc-soft: #183229;
      --warn: #f09a62; --warn-soft: #3a2518; --done: #5fcf8c; --screen: #0a0d12; --screen-text: #7df9c1;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.6 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--line);
           padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
  header h1 { font-size: 17px; margin: 0; }
  header .home { color: var(--accent); text-decoration: none; font-size: 14px; white-space: nowrap; }
  header .mine { color: var(--accent); text-decoration: none; font-size: 13px; }
  header .progress { color: var(--muted); font-size: 13px; }
  header .opts { margin-left: auto; display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; }
  header label { cursor: pointer; user-select: none; }
  .layout { display: grid; grid-template-columns: 240px 1fr; gap: 16px; max-width: 1100px;
            margin: 16px auto; padding: 0 16px; }
  nav { align-self: start; position: sticky; top: 64px; background: var(--card); border: 1px solid var(--line);
        border-radius: 10px; padding: 10px; max-height: calc(100vh - 80px); overflow: auto; }
  nav .sec { font-size: 12px; font-weight: 600; color: var(--muted); margin: 8px 2px 4px; }
  nav .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  nav button { border: 1px solid var(--line); background: transparent; color: var(--text); border-radius: 6px;
               font-size: 12px; padding: 2px 7px; cursor: pointer; }
  nav button.answered { background: var(--accent-soft); border-color: var(--accent); }
  nav button.current { outline: 2px solid var(--accent); font-weight: 700; }
  main { min-width: 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
  .sec-title { font-size: 13px; color: var(--muted); font-weight: 600; }
  details.dir { margin: 6px 0 12px; font-size: 13px; color: var(--muted); }
  details.dir summary { cursor: pointer; }
  .qhead { display: flex; align-items: baseline; gap: 10px; margin: 8px 0 12px; }
  .qhead h2 { margin: 0; font-size: 22px; }
  .qhead .time { color: var(--muted); }
  .block { margin: 10px 0; }
  .seg { padding: 8px 12px; border-radius: 8px; margin: 6px 0; }
  .seg.narration { background: var(--bg); }
  .seg.instruction { background: var(--accent-soft); font-weight: 600; }
  .seg.atc { background: var(--atc-soft); }
  .seg.atc b { color: var(--atc); }
  .seg.hidden { color: var(--muted); font-style: italic; }
  .seg.playing { outline: 2px solid var(--accent); }
  .seg.chime { background: transparent; color: var(--muted); padding: 2px 12px; }
  /* 실제 응시 화면의 상단 하늘색 띠 */
  .cuebar { background: #e8f4fb; border: 1px solid #b9d9ee; border-bottom-width: 3px;
            border-radius: 6px; padding: 10px 14px; margin: 0 0 14px; }
  .cuebar .cue { color: #1a5fa8; font-weight: 700; }
  .cuebar .cue + .cue { margin-top: 4px; }
  .cuebar .tag { color: #c02626; font-weight: 700; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .cuebar { background: #10212e; border-color: #1f4a66; }
  }
  .screen { background: var(--screen); color: var(--screen-text); font-family: ui-monospace, Consolas, monospace;
            padding: 10px 14px; border-radius: 8px; margin: 8px 0; }
  .pre-label { font-size: 12px; color: var(--muted); font-weight: 600; margin-top: 4px; }
  img.fig { max-width: 100%; border-radius: 8px; border: 1px solid var(--line); background: #fff; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 16px 0 10px; }
  button.btn { border: 1px solid var(--line); background: var(--card); color: var(--text); padding: 8px 14px;
               border-radius: 8px; cursor: pointer; font-size: 14px; }
  button.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.btn:disabled { opacity: .45; cursor: default; }
  .timer { flex: 1; min-width: 160px; display: flex; align-items: center; gap: 8px; }
  .bar { flex: 1; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .2s linear; }
  .bar.low > div { background: var(--warn); }
  .timer span { font-variant-numeric: tabular-nums; min-width: 42px; text-align: right; }
  .status { font-size: 13px; color: var(--muted); min-height: 20px; }
  textarea { width: 100%; min-height: 90px; border: 1px solid var(--line); border-radius: 8px; padding: 10px;
             font: inherit; background: var(--bg); color: var(--text); resize: vertical; }
  .nokey { max-width: 1100px; margin: 12px auto 0; padding: 10px 14px; border-radius: 8px;
           background: var(--warn-soft); color: var(--warn); font-size: 13px; }
  .nokey .btn { padding: 5px 10px; font-size: 13px; margin-left: 4px; }
  .live { font-size: 13px; color: var(--accent); min-height: 19px; font-style: italic; margin: 4px 0; }
  .heard { margin: 8px 0; padding: 9px 12px; border-radius: 8px; background: var(--atc-soft);
           font-size: 14px; }
  .heard b { display: block; font-size: 11px; letter-spacing: .04em; color: var(--muted);
             margin-bottom: 3px; }
  .heard .use { margin-left: 8px; font-size: 12px; }
  .rec { margin: 8px 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; }
  .sent { font-size: 12px; color: var(--muted); }
  .sent.ok { color: var(--done); }
  .sent.bad { color: var(--warn); }
  .rec audio { height: 34px; }
  details.model { margin-top: 12px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
  details.model summary { cursor: pointer; font-weight: 600; color: var(--done); }
  .nav-row { display: flex; justify-content: space-between; margin-top: 16px; gap: 8px; }
  .footer { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 40px; }
  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
    nav { position: static; max-height: none; }
    header .opts { margin-left: 0; }
  }
</style>
</head>
<body>
<header>
  <a class="home" href="/">← 목록</a>
  <h1 id="title"></h1>
  <span class="progress" id="progress"></span>
  <div class="opts">
    <label><input type="checkbox" id="optScript"> 스크립트 보기</label>
    <label><input type="checkbox" id="optSpeech" checked> 음성 인식</label>
    <label><input type="checkbox" id="optAudio" checked> 녹음 저장</label>
    <label><input type="checkbox" id="optAutoStart"> 다음 문항 자동 시작</label>
    <label id="optWakeLabel"><input type="checkbox" id="optWake" checked> 화면 켜두기</label>
    <a class="mine" id="mineLink" href="/r/">내 답안 보기 →</a>
  </div>
</header>

<p class="nokey" id="nokey" hidden>⚠ <b>서버 저장이 꺼져</b> 있습니다. 답안은 이 브라우저에만
   남습니다. <button class="btn" id="relogin">비밀번호 다시 입력</button></p>

<div class="layout">
  <nav id="nav"></nav>
  <main>
    <div class="card" id="card"></div>
    <div class="footer">
      <button class="btn" id="copyMd">답안 넣은 md 복사</button>
      <button class="btn" id="downloadMd">md 다운로드</button>
      <button class="btn" id="syncAll">모든 답안 서버로 저장</button>
      <button class="btn" id="reset">답안 초기화</button>
      <span class="status" id="footStatus"></span>
    </div>
  </main>
</div>

", "go around", "vectors", "troubleshooting", "souls on board", "minimum fuel", "mayday", "pan pan", "PIREP", "turbulence", "icing", "wake turbulence", "QNH", "ILS", "RNAV", "SID", "transition", "intercept", "localizer", "established", "expedite", "backtrack", "pushback", "start up", "deviation", "offset", "intentions", "descend", "climb", "maintain", "contact", "report", "due to performance", "due to weather", "clear of traffic", "in sight"]}, {"id": "P2C-Q3", "seconds": 90, "note": "", "pre": [{"type": "say", "voice": "narrator", "kind": "instruction", "text": "Now listen to the controller's radiotelephony messages.", "src": "/audio/WEAK_02/064cae18db1402a6.mp3"}, {"type": "say", "voice": "atc", "label": "ATC", "text": "HL123, Alderton Approach, descend to one one thousand, expect the PERNO ONE arrival, ILS runway two seven. Be advised, icing reported in cloud on the arrival.", "src": "/audio/WEAK_02/d2f45f28795fa7f4.mp3"}, {"type": "say", "voice": "atc", "label": "ATC", "text": "HL123, the freezing level is 7,000 feet. Reduce speed to one six zero knots until one zero miles.", "src": "/audio/WEAK_02/31efcc63d9c07a26.mp3"}, {"type": "say", "voice": "atc", "label": "ATC", "text": "HL123, roger, descend to 6,000 feet. Alderton runway two seven gives you 2,500 metres. Wexcombe has 3,000 metres and it's one two minutes away. What would you like?", "src": "/audio/WEAK_02/ba3e6c3cf22eb44a.mp3"}, {"type": "say", "voice": "atc", "label": "ATC", "text": "HL123, you're below the freezing level now, so I take it the ice has gone. Is that right, and do you want the fire service standing by?", "src": "/audio/WEAK_02/c5dffee396615288.mp3"}, {"type": "say", "voice": "atc", "label": "ATC", "text": "HL123, understood. Wexcombe's asking for your fuel endurance and how many people you've got on board.", "src": "/audio/WEAK_02/52ea2bf86a8fdca5.mp3"}, {"type": "say", "voice": "atc", "label": "ATC", "text": "HL123, turn right heading three zero zero, descend to 4,000 feet, reduce speed to two two zero knots. Can you do that speed? Contact Wexcombe Approach on 126.85.", "src": "/audio/WEAK_02/52b2f1183e20cdd1.mp3"}, {"type": "say", "voice": "atc", "label": "ATC", "text": "HL123, Wexcombe Approach, radar contact. I've got nothing on you yet — say your slowest speed and the number of persons on board.", "src": "/audio/WEAK_02/5ff2b52d7cf00d15.mp3"}, {"type": "say", "voice": "atc", "label": "ATC", "text": "HL123, turn left heading zero niner zero, descend to 3,000 feet until established, cleared for the ILS runway one two approach, contact Wexcombe Tower on 118.75.", "src": "/audio/WEAK_02/ef241c1ed1e5e277.mp3"}, {"type": "chime"}, {"type": "say", "voice": "narrator", "kind": "instruction", "text": "Now answer the questions.", "src": "/audio/WEAK_02/54a523a246e18a47.mp3"}], "body": [{"type": "say", "voice": "narrator", "kind": "narration", "text": "What happened to your aircraft (HL123)? Explain the nature of the incident.", "src": "/audio/WEAK_02/b55b0c790f9a94b5.mp3"}], "hints": ["Alderton", "Approach", "PERNO", "ONE", "ILS", "Reduce", "Wexcombe", "What", "Can", "Tower", "Hotel Lima one two three", "affirm", "negative", "unable", "wilco", "roger", "say again", "standby", "request", "readback", "squawk", "flight level", "heading", "altimeter", "knots", "Mach", "runway", "taxiway", "holding point", "hold short", "line up and wait", "cleared for takeoff", "cleared to land", "go around", "vectors", "troubleshooting", "souls on board", "minimum fuel", "mayday", "pan pan", "PIREP", "turbulence", "icing", "wake turbulence", "QNH", "ILS", "RNAV", "SID", "transition", "intercept", "localizer", "established", "expedite", "backtrack", "pushback", "start up", "deviation", "offset", "intentions", "descend", "climb", "maintain", "contact", "report", "due to performance", "due to weather", "clear of traffic", "in sight"]}, {"id": "P2C-Q4", "seconds": 90, "note": "", "pre": [], "body": [{"type": "say", "voice": "narrator", "kind": "narration", "text": "How do you think the incident was handled by the air traffic controller? Do you feel the situation could have been handled differently? Make a comment from a pilot's point of view.", "src": "/audio/WEAK_02/a0bd8a27f261ce2d.mp3"}], "hints": ["How", "Hotel Lima one two three", "affirm", "negative", "unable", "wilco", "roger", "say again", "standby", "request", "readback", "squawk", "flight level", "heading", "altimeter", "knots", "Mach", "runway", "taxiway", "holding point", "hold short", "line up and wait", "cleared for takeoff", "cleared to land", "go around", "vectors", "troubleshooting", "souls on board", "minimum fuel", "mayday", "pan pan", "PIREP", "turbulence", "icing", "wake turbulence", "QNH", "ILS", "RNAV", "SID", "transition", "intercept", "localizer", "established", "expedite", "backtrack", "pushback", "start up", "deviation", "offset", "intentions", "descend", "climb", "maintain", "contact", "report", "due to performance", "due to weather", "clear of traffic", "in sight"]}]}], "set": "WEAK_02", "raw": "# EPTA 약점 집중 세트 02 — 2026-11-05\n\n안 내 실전 모의세트가 아니다. 11세트 채점에서 실패율이 높은 다섯 유형을 **WEAK_01 과 겹치지\n않는 새 문항**으로 모았다. 순수 복창처럼 잘하는 유형은 원래 빼지만, **뒤 문항에 답하려면 그\n교신이 꼭 있어야 할 때만 앞 문항으로 넣었다.** 지문으로 설명해 주지 않고 직접 풀게 한다.\n그 문항에서 듣거나 말한 값은 **적어 두고 다음 문항에서 쓴다.**\n메모 가능 / 문항당 1회 Say again. 응시자 콜사인은 항상 **HL123**.\n\n| 파트 | 겨냥하는 유형 | 문항 | 이어지는 문항 (앞 → 뒤) |\n|---|---|---:|---|\n| A | **복창 + α** | 11 | Q1 → Q2 · Q6 → Q7 · Q8 → Q9 · Q10 → Q11 |\n| B | **판단 + 이유** (수락·거부, 최저·최대) | 7 | Q5 → Q6 |\n| C | **값 유지** (되묻기 롤플레이) | 10 | 전체가 이어진다 |\n| D | **발신** (기관 호출 · REQUEST + 명사구) | 7 | Q3 → Q4 |\n| E | **90초 자유응답** (C 파트에 대해 답한다) | 4 | C → 전체 |\n\n---\n\n## 약점 A. 복창 + α\n\n✅ Directions : You will be listening to ATC instructions and making calls of your own. Most\nquestions ask you to do **more than read back.** Some questions continue from the question\nbefore, so keep your notes. Your callsign is HL123. \"Say again (=Repeat)\" available once only.\n  * Response time for each question : 20 or 30 seconds, as shown\n\n**P1A-Q1** 🎙 20초\n🖥 [ LIDRO ]\nApproach : HL123, cleared direct LIDRO, descend to 9,000 feet, expect one five minutes of delay.\n\nRecord your full readback.\n\n[정답]\n\n\n---\n\n**P1A-Q2** 🎙 30초\nYou are now on the way to LIDRO. You want to know how much delay to expect now.\nApproach : HL123, descend to 7,000 feet. The aircraft ahead has just gone around, so your\ndelay will be longer.\n\nGive a full readback, tell him what you were told earlier, and inquire how long the delay\nwill be now.\n\n[정답]\n\n\n---\n\n**P1A-Q3** 🎙 30초\nYour cabin crew are still securing the cabin. For the next three minutes the highest rate of\ndescent you can accept is 1,500 feet per minute.\nCenter : HL123, descend to flight level two four zero, two five hundred feet per minute or\ngreater.\n\nGive a full readback, and tell him what you can do instead.\n\n[정답]\n\n\n---\n\n**P1A-Q4** 🎙 30초\nYour performance figures today are for the full length of runway zero nine, so you cannot\ndepart from Mike three. You want to go to holding point Mike one.\nGround : HL123, taxi to holding point Mike three via Tango, hold short of runway zero nine.\n\nGive a full readback, and make a request with a reason.\n\n[정답]\n\n\n---\n\n**P1A-Q5** 🎙 30초\nDuring your landing roll you saw a large dog on the grass beside taxiway Delta. You were busy\nand you have not reported it. You want the controller to know.\nGround : HL123, taxi to stand two two via Kilo, give way to the Airbus A380 on your left.\n\nGive a full readback, and report what you saw.\n\n[정답]\n\n\n---\n\n**P1A-Q6** 🎙 20초\nYou are level at flight level one six zero, 40 miles from Wexcombe. A cabin crew member has a\nserious burn on one hand from the galley oven. You want the controller to know about it.\nContact Wexcombe Approach.\n\nReport your status.\n\n[정답]\n\n\n---\n\n**P1A-Q7** 🎙 30초\nYou want to land at Wexcombe on the next available runway, with a medical team at the stand.\nApproach : HL123, roger, turn left heading one three zero, descend to 6,000 feet, vectors for\nWexcombe. Say your intentions.\n\nGive a full readback, and say your intentions.\n\n[정답]\n\n\n---\n\n**P1A-Q8** 🎙 20초\nYou are at stand one eight at Alderton, ready to push back. You want pushback and start-up.\nContact Alderton Ground.\n\nMake a request.\n\n[정답]\n\n\n---\n\n**P1A-Q9** 🎙 30초\nJust after your call, dispatch tells you that a passenger has not boarded and that their bags\nmust be offloaded. It will take one two minutes.\nGround : HL123, hold position. Report when you are ready. I have an inbound for your stand in\nabout one zero minutes.\n\nGive a full readback, acknowledge his situation, and tell him how long you need with a reason.\n\n[정답]\n\n\n---\n\n**P1A-Q10** 🎙 20초\nYou were on the ILS runway one eight at Pembury. At 800 feet you lost one five knots in\nwindshear and you went around. You are now passing 2,000 feet. Contact Pembury Approach.\n\nReport your status.\n\n[정답]\n\n\n---\n\n**P1A-Q11** 🎙 30초\nYou want to hold for two zero minutes until the weather has passed.\nApproach : HL123, roger, climb to 4,000 feet, turn right heading three six zero. Two things —\nhow much airspeed did you lose, and do you want another approach, or do you want to hold?\n\nGive a full readback, and answer both of his questions.\n\n[정답]\n\n\n---\n\n## 약점 B. 판단 + 이유\n\n✅ Directions : In each question you are given your own figure. **Decide, say why, and give\nthe controller both figures.** Sometimes you can accept and sometimes you cannot. One question\ncontinues from the question before. Your callsign is HL123.\n  * Response time for each question : 20 or 30 seconds, as shown\n\n**P1B-Q1** 🎙 30초\nYour maximum tailwind for landing is one five knots. You want the shorter routing if you can\naccept it.\nApproach : HL123, runway zero nine is available with a one zero knot tailwind, and it saves\nyou one two minutes. Can you accept?\n\nRespond accordingly with a reason.\n\n[정답]\n\n\n---\n\n**P1B-Q2** 🎙 30초\nYou are heavy today. With the flaps you have out, the slowest speed you can hold is one eight\nzero knots.\nApproach : HL123, reduce speed to two one zero knots until one two miles. Can you do that?\n\nRespond accordingly with a reason.\n\n[정답]\n\n\n---\n\n**P1B-Q3** 🎙 30초\n🖥 [ MAVIK ]\nA dispatch restriction in your technical log today limits you to two three zero knots or less.\nYou can give the controller two three zero knots until MAVIK.\nCenter : HL123, maintain two six zero knots or greater until MAVIK for spacing. Can you do that?\n\nRespond accordingly with a reason.\n\n[정답]\n\n\n---\n\n**P1B-Q4** 🎙 30초\n🖥 [ Pembury / Dunmere ]\nYour minimum RVR for this approach is 550 metres. You have enough fuel for either airport. You\nwant to land at the first airport you can legally land at.\nApproach : HL123, Pembury RVR runway one eight is 450 metres and dropping. Dunmere RVR is 800\nmetres, one six minutes away. Say your intentions.\n\nSay your intentions.\n\n[정답]\n\n\n---\n\n**P1B-Q5** 🎙 20초\n🖥 [ ZENTA ]\nApproach : HL123, hold at ZENTA, left turns, maintain 8,000 feet, expect approach clearance at\n1125Z.\n\nRecord your full readback.\n\n[정답]\n\n\n---\n\n**P1B-Q6** 🎙 30초\nIt is now 1105Z and you are holding at ZENTA. Your fuel endurance is one hour one zero minutes\nand your diversion to Dunmere needs three five minutes. You would rather stay if your fuel\nallows it.\nApproach : HL123, are you able to accept that delay, or do you want to divert now?\n\nRespond accordingly with a reason.\n\n[정답]\n\n\n---\n\n**P1B-Q7** 🎙 30초\nYou are at 9,000 feet, still in heavy rain and moderate turbulence. You want to stay on heading\none four zero for five more miles to get out of it.\nApproach : HL123, the last cell cleared the field one zero minutes ago, so you should be clear\nof the weather now?\n\nRespond accordingly and make a request with a reason.\n\n[정답]\n\n\n---\n\n## 약점 C. 값 유지 — 되묻기 롤플레이\n\n✅ Directions : In Part C you will be interacting with an Air traffic controller through ten\nturns. **The controller will ask you for your figures later in the scenario, and some of them\nwill have changed.** Follow the prompts and respond as necessary. \"Say again (=Repeat)\" available\nonly once. Your callsign is HL123.\n  * Response time for each question : 30 seconds or less\n\nInitial Situation You are the pilot of HL123, level at flight level two one zero, 60 miles from\nPERNO, inbound to Alderton Airport. Your fuel endurance is two hours three five minutes and\nthere are one six three persons on board. Your required landing distance is 2,200 metres, and\nat today's weight the slowest speed you can hold is one eight zero knots. 🔔(dingdong)\n\n**P2A-Q1** 🎙 30초\n☞ Contact Alderton Approach, report your position and level, and request descent.\n\n[정답]\n\n\n---\n\n**P2A-Q2** 🎙 30초\n🖥 [ PERNO ONE arrival ]\n☞ Listen to the controller, give a full readback, and inquire about the freezing level.\nApproach : HL123, Alderton Approach, descend to one one thousand, expect the PERNO ONE arrival,\nILS runway two seven. Be advised, icing reported in cloud on the arrival.\n\n[정답]\n\n\n---\n\n**P2A-Q3** 🎙 30초\n☞ Listen to the controller, give a full readback, and tell him what you can do instead.\nApproach : HL123, the freezing level is 7,000 feet. Reduce speed to one six zero knots until\none zero miles.\n\n[정답]\n\n\n---\n\nSituation Update Passing 12,000 feet you get a WING ANTI-ICE FAULT caption for the left wing, and\nice is building on that wing. You want to descend to 6,000 feet to get below the freezing level.\nYour slowest speed is now two zero zero knots and your required landing distance is now\n2,700 metres. 🔔(dingdong)\n\n**P2A-Q4** 🎙 30초\n☞ Report your problem to the controller, tell him what has changed, and make a request with a\nreason.\n\n[정답]\n\n\n---\n\n**P2A-Q5** 🎙 30초\n🖥 [ Alderton / Wexcombe ]\n☞ Listen to the controller, give a full readback, and state your decision with a reason.\nApproach : HL123, roger, descend to 6,000 feet. Alderton runway two seven gives you 2,500 metres.\nWexcombe has 3,000 metres and it's one two minutes away. What would you like?\n\n[정답]\n\n\n---\n\nSituation Update You are now level at 6,000 feet, below the freezing level. There is still ice\non the left wing. You want the fire service standing by as a precaution. 🔔(dingdong)\n\n**P2A-Q6** 🎙 30초\n☞ Listen to the controller and answer both of his questions.\nApproach : HL123, you're below the freezing level now, so I take it the ice has gone. Is that\nright, and do you want the fire service standing by?\n\n[정답]\n\n\n---\n\n**P2A-Q7** 🎙 30초\n☞ Listen to the controller and provide the requested information.\nApproach : HL123, understood. Wexcombe's asking for your fuel endurance and how many people\nyou've got on board.\n\n[정답]\n\n\n---\n\n**P2A-Q8** 🎙 30초\n☞ Listen to the controller, give a full readback, and tell him whether you can do that with a\nreason.\nApproach : HL123, turn right heading three zero zero, descend to 4,000 feet, reduce speed to two\ntwo zero knots. Can you do that speed? Contact Wexcombe Approach on 126.85.\n\n[정답]\n\n\n---\n\n**P2A-Q9** 🎙 30초\n☞ You are now with a new controller who has none of your figures. Listen to him and answer both\nof his questions.\nApproach : HL123, Wexcombe Approach, radar contact. I've got nothing on you yet — say your\nslowest speed and the number of persons on board.\n\n[정답]\n\n\n---\n\nSituation Update The ice has now gone from the left wing. The fault remains, so your figures do\nnot change. 🔔(dingdong)\n\n**P2A-Q10** 🎙 30초\n☞ Listen to the controller, give a full readback, and tell him about the ice and the fault.\nApproach : HL123, turn left heading zero niner zero, descend to 3,000 feet until established,\ncleared for the ILS runway one two approach, contact Wexcombe Tower on 118.75.\n\n[정답]\n\n\n---\n\n## 약점 D. 발신 — 기관 호출 · REQUEST + 명사구\n\n✅ Directions : In Part D you usually call first, with **no controller transmission.** Each\nsituation tells you what you want. One question continues from the question before. Your callsign\nis HL123.\n  * Response time for each question : 20 seconds or less\n\n**P2B-Q1** 🎙 20초\n🖥 [ Stanmore Control ]\nYou are level at flight level three three zero. You are burning more fuel than planned at this\nlevel. You want flight level three seven zero. Contact Stanmore Control.\n\nMake a request with a reason.\n\n[정답]\n\n\n---\n\n**P2B-Q2** 🎙 20초\n🖥 [ Alderton Delivery / GOSMA TWO / LIDRO ONE ]\nAt today's weight you cannot meet the climb gradient on the GOSMA TWO departure. You want the\nLIDRO ONE departure instead. Contact Alderton Delivery.\n\nReport your situation and make a request.\n\n[정답]\n\n\n---\n\n**P2B-Q3** 🎙 20초\n🖥 [ ROLDA ]\nCenter : HL123, reduce speed to two five zero knots until ROLDA.\n\nRecord your full readback.\n\n[정답]\n\n\n---\n\n**P2B-Q4** 🎙 20초\nTwo minutes later you see that you selected the wrong speed by mistake. You are at two eight\nzero knots and nobody has said anything to you. You are reducing now. Contact Stanmore Control.\n\nReport your status and say your intentions.\n\n[정답]\n\n\n---\n\n**P2B-Q5** 🎙 20초\n🖥 [ Dunmere ]\nFog is forecast at Dunmere, your destination. You want the latest Dunmere weather before you\nstart your descent. Contact Stanmore Control.\n\nMake a request with a reason.\n\n[정답]\n\n\n---\n\n**P2B-Q6** 🎙 20초\nOne minute ago, passing 5,000 feet, about five miles south of the field, a green laser from the\nground lit up your cockpit. You want the controller to know about it. Contact Pembury Approach.\n\nMake a report.\n\n[정답]\n\n\n---\n\n**P2B-Q7** 🎙 20초\nYou are holding short of runway zero nine at Alderton. The oil quantity on engine number two is\ndropping. You want to go back to the stand. Contact Alderton Tower.\n\nReport your status and make a request.\n\n[정답]\n\n\n---\n\n## 약점 E. 90초 자유응답\n\n✅ Directions : You will be asked four questions about Part C. **You have up to 90 seconds for\neach.** Answer every part of the question.\n\n**P2C-Q1** 🎙 90초\nFollow up question.\n\nIn this situation, you told the controller about the fault and what had changed. Which figures\nchanged, and why did he need to know them? In your role as a pilot, how do you make sure you use\nthe latest figure and not the old one? Give an example.\n\n[정답]\n\n\n\n\n---\n\n**P2C-Q2** 🎙 90초\nFollow up question.\n\nIn this situation, the controller thought the ice had gone, but it had not. Why was it important\nto correct him straight away? From your own experiences, how do you report a problem that is\nstill going on? Give an example.\n\n[정답]\n\n\n\n\n---\n\n☞ Now listen to the controller's radiotelephony messages.\n\nATC: HL123, Alderton Approach, descend to one one thousand, expect the PERNO ONE arrival,\nILS runway two seven. Be advised, icing reported in cloud on the arrival.\nATC: HL123, the freezing level is 7,000 feet. Reduce speed to one six zero knots until\none zero miles.\nATC: HL123, roger, descend to 6,000 feet. Alderton runway two seven gives you 2,500 metres.\nWexcombe has 3,000 metres and it's one two minutes away. What would you like?\nATC: HL123, you're below the freezing level now, so I take it the ice has gone. Is that\nright, and do you want the fire service standing by?\nATC: HL123, understood. Wexcombe's asking for your fuel endurance and how many people\nyou've got on board.\nATC: HL123, turn right heading three zero zero, descend to 4,000 feet, reduce speed to two\ntwo zero knots. Can you do that speed? Contact Wexcombe Approach on 126.85.\nATC: HL123, Wexcombe Approach, radar contact. I've got nothing on you yet — say your\nslowest speed and the number of persons on board.\nATC: HL123, turn left heading zero niner zero, descend to 3,000 feet until established,\ncleared for the ILS runway one two approach, contact Wexcombe Tower on 118.75. 🔔(dingdong)\n\n☞ Now answer the questions.\n\n**P2C-Q3** 🎙 90초\nWhat happened to your aircraft (HL123)? Explain the nature of the incident.\n\n[정답]\n\n\n\n\n---\n\n**P2C-Q4** 🎙 90초\nHow do you think the incident was handled by the air traffic controller? Do you feel the\nsituation could have been handled differently? Make a comment from a pilot's point of view.\n\n[정답]\n\n\n\n\n---\n", "answers": {}}</script>
<script>
(() => {
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const KEY = 'epta:' + DATA.set;
  const PAUSE_MS = 600;

  const flat = [];
  DATA.sections.forEach((sec, si) => sec.questions.forEach((q, qi) => flat.push({ ...q, si, first: qi === 0 })));

  const store = {
    get(name, fallback) {
      try { return JSON.parse(localStorage.getItem(KEY + ':' + name)) ?? fallback; } catch { return fallback; }
    },
    set(name, value) { try { localStorage.setItem(KEY + ':' + name, JSON.stringify(value)); } catch {} },
  };

  const answers = store.get('answers', {});
  const sayAgainUsed = store.get('sayagain', {});
  const recordings = {};                 // id → blob URL (이 탭에서만)
  const opts = store.get('opts', { script: false, speech: true, audio: true, autoStart: false, wake: true });
  opts.wake ??= true;                   // 예전에 저장된 설정에도 기본값을 준다
  // 녹음이 기본 꺼짐이던 때 저장된 설정을 한 번만 켜준다
  if (!store.get('optsV2', false)) {
    opts.audio = true; opts.speech = true;
    store.set('opts', opts); store.set('optsV2', true);
  }

  function stamp() {
    const d = new Date(), z = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}${z(d.getMonth() + 1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}`;
  }

  // 응시 세션 — 서버에 이 묶음으로 저장된다. '답안 초기화' 하면 새 세션이 열린다.
  let session = store.get('session', '');
  if (!session) { session = stamp(); store.set('session', session); }

  // 서버 비밀키는 들어올 때 비밀번호를 확인한 서버가 내려준다 (gate.js → /api/login).
  // HTML 소스에도, 주소에도 들어가지 않는다.
  let token = '';

  let idx = Math.min(store.get('idx', 0), flat.length - 1);
  let phase = 'idle';                    // idle | playing | answering | done
  let revealed = false;
  let runId = 0;                         // 재생·타이머 취소용
  let timerHandle = null;
  let recorder = null, micStream = null;
  let recog = null, recogFinal = '', recogBase = '';
  let recStop = null;                    // 녹음 마무리를 기다리는 약속
  let speechStarted = false;             // 인식이 실제로 시작됐는지
  let speechError = '';                  // 인식이 실패한 이유
  const sent = {};                       // id → 전송 상태 문자열
  const lastSent = {};                   // id → 서버로 보낸 마지막 글자
  const heard = {};                      // id → 서버가 녹음에서 알아들은 글자
  const sentAudio = {};                  // id → 녹음까지 보냈는지
  let typeTimer = null;

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  /* ───────── 소리 ───────── */

  const player = new Audio();
  let actx = null;
  const ctx = () => (actx ??= new (window.AudioContext || window.webkitAudioContext)());

  function tone(freq, start, dur, gain = 0.25) {
    const c = ctx(), o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(gain, c.currentTime + start);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + start + dur);
    o.connect(g).connect(c.destination);
    o.start(c.currentTime + start); o.stop(c.currentTime + start + dur);
  }
  const chime = () => { tone(784, 0, 0.9); tone(622, 0.45, 1.1); return wait(1600); };
  const beep = () => { tone(1000, 0, 0.35, 0.2); };
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  function playSrc(src) {
    return new Promise((resolve, reject) => {
      player.src = src;
      player.onended = resolve;
      player.onerror = () => reject(new Error('음성 파일을 열 수 없습니다: ' + src));
      player.play().catch(reject);
    });
  }

  async function playSegments(segs, my) {
    for (const seg of segs) {
      if (my !== runId) return false;
      if (seg.type === 'chime') { await chime(); continue; }
      if (seg.type !== 'say') continue;
      const el = document.querySelector(`[data-src="${seg.src}"]`);
      el?.classList.add('playing');
      try { await playSrc(seg.src); } finally { el?.classList.remove('playing'); }
      if (my !== runId) return false;
      await wait(PAUSE_MS);
    }
    return my === runId;
  }

  function stopAll() {
    runId++;
    player.pause();
    clearInterval(timerHandle);
    stopSpeech();
    stopRecording();
  }

  /* ───────── 화면 꺼짐 방지 ─────────
     문제를 듣는 20~30초, 답하는 30~90초 동안 손을 대지 않으므로 화면 자동 잠금이 걸린다.
     첫 '시작' 때 Screen Wake Lock 을 잡고 세트를 끝낼 때까지 들고 있는다.
     브라우저가 탭을 숨기면 OS 가 잠금을 알아서 풀기 때문에, 돌아왔을 때 다시 잡아준다. */

  const wakeSupported = 'wakeLock' in navigator;
  let wakeSentinel = null;              // 지금 잡고 있는 잠금
  let wakeWanted = false;               // 잡고 있어야 하는 상태인가

  async function wakeOn() {
    wakeWanted = true;
    if (!opts.wake || !wakeSupported || wakeSentinel) return;
    if (document.visibilityState !== 'visible') return;
    try {
      wakeSentinel = await navigator.wakeLock.request('screen');
      wakeSentinel.addEventListener('release', () => { wakeSentinel = null; });
    } catch {
      wakeSentinel = null;              // 배터리 절약 모드 등에서는 거부된다
    }
  }

  function wakeOff({ keep = false } = {}) {
    if (!keep) wakeWanted = false;
    wakeSentinel?.release?.().catch(() => {});
    wakeSentinel = null;
  }

  /* ───────── 음성 인식 — 말하면 바로 글자로 ───────── */

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  function startSpeech(id) {
    if (!opts.speech) return;
    if (!SR) { setStatus('이 브라우저는 음성 인식을 지원하지 않습니다 — 타이핑으로 답하세요.'); return; }

    recogBase = (answers[id] || '').trim();   // 이미 적어둔 내용은 보존하고 뒤에 붙인다
    recogFinal = '';
    speechStarted = false;
    speechError = '';
    const r = new SR();
    recog = r;
    r.lang = 'en-US';
    r.continuous = true;
    r.interimResults = true;
    r.maxAlternatives = 1;

    r.onresult = (e) => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const txt = e.results[i][0].transcript.trim();
        if (e.results[i].isFinal) { if (txt) recogFinal += (recogFinal ? ' ' : '') + txt; }
        else interim += txt + ' ';
      }
      const merged = [recogBase, recogFinal].filter(Boolean).join(' ');
      answers[id] = merged;
      store.set('answers', answers);
      const ta = $('answer'); if (ta) ta.value = merged;
      const lv = $('live'); if (lv) lv.textContent = interim ? '… ' + interim : '';
    };

    r.onstart = () => { speechStarted = true; };

    r.onerror = (e) => {
      const why = {
        'not-allowed': '마이크 권한이 거부되었습니다',
        'service-not-allowed': '브라우저가 음성 인식을 막았습니다',
        'network': '음성 인식 서버에 연결할 수 없습니다',
        'audio-capture': '마이크를 잡을 수 없습니다 (녹음과 충돌했을 수 있습니다)',
        'aborted': '',
        'no-speech': '',
      }[e.error] ?? `음성 인식 오류 (${e.error})`;
      if (why) { speechError = why; setStatus(why + ' — 타이핑으로 답하세요.'); }
    };

    // 안드로이드 크롬은 잠깐 조용하면 알아서 끊긴다. 응답시간 동안은 계속 되살린다.
    r.onend = () => { if (recog === r && phase === 'answering') { try { r.start(); } catch {} } };

    try { r.start(); } catch { recog = null; }
  }

  function stopSpeech() {
    const r = recog;
    if (!r) return;
    recog = null;
    r.onend = null;
    try { r.stop(); } catch {}
    const lv = $('live'); if (lv) lv.textContent = '';
  }

  /* ───────── 녹음 (선택 — 나중에 다시 들어보려면) ───────── */

  async function startRecording(id) {
    recStop = null;
    if (!opts.audio) return;
    if (!window.MediaRecorder || !navigator.mediaDevices?.getUserMedia) {
      setStatus('이 브라우저는 녹음을 지원하지 않습니다 — 답안은 글자로만 저장됩니다.');
      return;
    }
    try {
      micStream ??= await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch {
      setStatus('마이크 권한이 없어 녹음을 못 합니다 — 답안은 글자로만 저장됩니다.');
      return;
    }

    // ★ recorder 를 지역 변수로 붙잡는다. 전역만 쓰면 stop 뒤에 null 이 되어
    //   onstop 안에서 터지고 녹음 파일이 만들어지지 않는다.
    let rec;
    try { rec = new MediaRecorder(micStream); }
    catch { setStatus('녹음을 시작할 수 없습니다 — 답안은 글자로만 저장됩니다.'); return; }

    const chunks = [];
    recorder = rec;
    recStop = new Promise((resolve) => {
      rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
      rec.onerror = () => { setStatus('녹음 중 오류가 났습니다 — 글자만 저장됩니다.'); resolve(); };
      rec.onstop = () => {
        if (chunks.length) {
          if (recordings[id]) URL.revokeObjectURL(recordings[id].url);
          const blob = new Blob(chunks, { type: rec.mimeType || 'audio/webm' });
          recordings[id] = { blob, url: URL.createObjectURL(blob) };
          if (flat[idx].id === id) renderRecording();
        }
        resolve();
      };
    });
    try { rec.start(); } catch { recorder = null; recStop = null; }
  }

  function stopRecording() {
    const rec = recorder;
    recorder = null;
    if (rec && rec.state !== 'inactive') rec.stop();
    else recStop = null;
  }

  /* ───────── 진행 ───────── */

  async function start() {
    const q = flat[idx];
    wakeOn();
    stopAll();
    const my = runId;
    phase = 'playing'; render();
    setStatus('듣는 중…');
    try {
      if (!(await playSegments(q.pre, my))) return;
      if (!(await playSegments(q.body, my))) return;
    } catch (e) { setStatus(e.message); phase = 'idle'; render(); return; }
    answer(my);
  }

  async function sayAgain() {
    const q = flat[idx];
    if (sayAgainUsed[q.id]) return;
    sayAgainUsed[q.id] = true; store.set('sayagain', sayAgainUsed);
    wakeOn();
    stopAll();
    const my = runId;
    phase = 'playing'; render();
    setStatus('Say again — 다시 듣는 중…');
    try {
      if (!(await playSegments(q.body, my))) return;
    } catch (e) { setStatus(e.message); phase = 'idle'; render(); return; }
    answer(my);
  }

  function answer(my) {
    const q = flat[idx];
    phase = 'answering'; render();
    setStatus((opts.speech ? '응답하세요 — 말하면 글자로 들어갑니다' : '응답하세요 — 타이핑')
      + (opts.audio ? ' · 녹음 중' : ''));
    // 인식이 마이크를 먼저 잡게 하고, 녹음을 뒤에 붙인다 (동시에 열면 인식이 밀린다)
    startSpeech(q.id);
    setTimeout(() => { if (my === runId) startRecording(q.id); }, 400);
    const total = q.seconds * 1000, t0 = Date.now();
    const tick = () => {
      if (my !== runId) return;
      const left = Math.max(0, total - (Date.now() - t0));
      setTimer(left / 1000, q.seconds);
      if (left <= 0) finish(true);
    };
    tick();
    timerHandle = setInterval(tick, 200);
  }

  async function finish(timeUp) {
    const q = flat[idx];
    stopAll();
    if (timeUp) beep();
    phase = 'done'; revealed = true;
    render();
    setStatus(timeUp ? '시간 종료' : '응답 종료');

    // 녹음 파일이 다 만들어질 때까지 기다린다 (최대 3초)
    const pending = recStop;
    recStop = null;
    if (pending) await Promise.race([pending, wait(3000)]);
    // 음성 인식의 마지막 조각이 들어올 시간
    await wait(400);

    if (opts.speech && !recogFinal.trim()) {
      setStatus(
        speechError ? `${speechError} — 답안이 비었습니다. 타이핑해 주세요.`
        : !SR ? '이 브라우저는 음성 인식을 지원하지 않습니다 — 타이핑해 주세요.'
        : !speechStarted ? '음성 인식이 시작되지 않았습니다 — 녹음 저장을 끄고 다시 해보세요.'
        : '음성 인식이 아무 말도 못 들었습니다 — 마이크에 가까이, 또는 타이핑해 주세요.');
    }
    submit(q);
  }

  /* ───────── 서버 전송 ───────── */

  // 아직 서버에 안 보낸 내용이 있는지
  function dirty(id) {
    const text = (answers[id] || '').trim();
    if (text && text !== lastSent[id]) return true;
    return !!(recordings[id]?.blob && !sentAudio[id]);
  }

  async function submit(q, { keepalive = false } = {}) {
    if (!token) return false;           // 주소에 #k=... 가 없으면 로컬에만 남는다
    if (!dirty(q.id)) return true;      // 이미 보낸 그대로면 다시 보내지 않는다

    const text = (answers[q.id] || '').trim();
    const blob = sentAudio[q.id] ? null : recordings[q.id]?.blob;
    if (!text && !blob) return true;

    sent[q.id] = '보내는 중…'; renderSent();
    const body = {
      set: DATA.set, session, qid: q.id,
      answer: text, seconds: q.seconds, hints: q.hints || [],
    };
    // 페이지가 닫히는 중이면 녹음은 포기하고 글자만 확실히 보낸다
    if (blob && !keepalive) {
      body.mime = blob.type || 'audio/webm';
      body.audio = await toBase64(blob);
    }
    try {
      const r = await fetch('/api/submit', {
        method: 'POST',
        headers: { 'content-type': 'application/json', 'x-epta-token': token },
        body: JSON.stringify(body),
        keepalive,
      });
      const j = await r.json().catch(() => ({}));
      if (r.ok) {
        lastSent[q.id] = text;
        if (body.audio) sentAudio[q.id] = true;
        sent[q.id] = body.audio ? '저장됨 · 녹음 포함' : '저장됨';

        const said = (j.transcript || '').trim();
        if (said) {
          heard[q.id] = said;
          // 답안칸이 비어 있으면 서버가 알아들은 것으로 채운다
          if (!text) {
            answers[q.id] = said;
            lastSent[q.id] = said;       // 방금 서버에서 온 것이니 다시 보낼 필요 없다
            store.set('answers', answers);
            if (flat[idx].id === q.id) { const ta = $('answer'); if (ta) ta.value = said; }
            renderNav();
          }
          if (flat[idx].id === q.id) renderHeard();
        }
        if (j.sttError && flat[idx].id === q.id) {
          setStatus('녹음은 저장됐지만 서버 전사에 실패했습니다: ' + j.sttError);
        }
      } else {
        sent[q.id] = `저장 실패 (${j.error || r.status})`;
      }
      renderSent();
      return r.ok;
    } catch {
      sent[q.id] = '저장 실패 — 네트워크';
      renderSent();
      return false;
    }
  }

  // 타이핑이 멈추면 조금 뒤에 저장한다
  function queueSubmit(q) {
    clearTimeout(typeTimer);
    typeTimer = setTimeout(() => submit(q), 1500);
  }

  // 남은 것 전부 — 화면을 떠날 때, 그리고 버튼을 눌렀을 때
  async function flushAll(opts2 = {}) {
    const todo = flat.filter((q) => dirty(q.id));
    if (!todo.length) return { ok: 0, fail: 0, todo: 0 };
    let ok = 0;
    for (const q of todo) ok += (await submit(q, opts2)) ? 1 : 0;
    return { ok, fail: todo.length - ok, todo: todo.length };
  }

  function toBase64(blob) {
    return new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onload = () => resolve(String(fr.result).split(',')[1]);
      fr.onerror = reject;
      fr.readAsDataURL(blob);
    });
  }

  function renderHeard() {
    const box = $('heard'); if (!box) return;
    const said = heard[flat[idx].id];
    if (!said) { box.innerHTML = ''; return; }
    const same = said === (answers[flat[idx].id] || '').trim();
    box.innerHTML = `<b>녹음에서 알아들은 말 (서버)</b>${esc(said)}`
      + (same ? '' : `<button class="btn use" id="useHeard">이걸 답안으로</button>`);
    $('useHeard')?.addEventListener('click', () => {
      const q = flat[idx];
      answers[q.id] = said;
      store.set('answers', answers);
      const ta = $('answer'); if (ta) ta.value = said;
      renderNav(); renderHeard();
      submit(q);
    });
  }

  function renderSent() {
    const el = $('sent'); if (!el) return;
    const s = sent[flat[idx].id] || '';
    el.textContent = s;
    el.className = 'sent' + (s.startsWith('저장됨') ? ' ok' : s.startsWith('저장 실패') ? ' bad' : '');
  }

  function go(to) {
    if (to < 0 || to >= flat.length) return;
    clearTimeout(typeTimer);
    submit(flat[idx]);                  // 떠나기 전에 지금 문항을 저장한다
    stopAll();
    idx = to; store.set('idx', idx);
    phase = 'idle'; revealed = false;
    render();
    window.scrollTo({ top: 0 });
    if (opts.autoStart) start();
  }

  /* ───────── 화면 ───────── */

  function segHtml(seg) {
    const show = opts.script || revealed;
    if (seg.type === 'chime') return `<div class="seg chime">🔔 dingdong</div>`;
    if (seg.type === 'screen') return `<div class="cue">☞ ${esc(seg.text)}</div>`;
    if (seg.type === 'image') return `<img class="fig" src="${esc(seg.src)}" alt="">`;
    if (seg.kind === 'instruction') return `<div class="seg instruction" data-src="${seg.src}">☞ ${esc(seg.text)}</div>`;
    if (seg.voice === 'atc') {
      return show
        ? `<div class="seg atc" data-src="${seg.src}"><b>${esc(seg.label)} :</b> ${esc(seg.text)}</div>`
        : `<div class="seg atc hidden" data-src="${seg.src}"><b>${esc(seg.label)} :</b> 🔊 (음성)</div>`;
    }
    const tag = /^(Flight Paths|Initial Situation|Situation Update)\.?\s*/.exec(seg.text || '');
    const body = tag ? seg.text.slice(tag[0].length) : (seg.text || '');
    const head = tag ? `<span class="tag">[${esc(tag[1])}]</span> ` : '';
    return show
      ? `<div class="seg narration" data-src="${seg.src}">${head}${esc(body)}</div>`
      : `<div class="seg narration hidden" data-src="${seg.src}">🔊 상황 설명 (음성)</div>`;
  }

  function render() {
    const q = flat[idx], sec = DATA.sections[q.si];
    const model = (DATA.answers || {})[q.id];
    const used = !!sayAgainUsed[q.id];

    $('title').textContent = DATA.set;
    $('progress').textContent = `${idx + 1} / ${flat.length}`;

    // 실제 시험처럼 화면 클루(☞)는 본문에서 빼서 맨 위 띠에 모아 보여준다
    const isCue = (s) => s.type === 'screen';
    const cues = [...q.pre, ...q.body].filter(isCue);
    const pre = q.pre.filter((s) => !isCue(s));
    const body = q.body.filter((s) => !isCue(s));

    $('card').innerHTML = `
      <div class="sec-title">${esc(sec.title)}</div>
      ${q.first && sec.directions ? `<details class="dir"${phase === 'idle' ? ' open' : ''}><summary>Directions</summary>${esc(sec.directions)}</details>` : ''}
      ${cues.length ? `<div class="cuebar">${cues.map(segHtml).join('')}</div>` : ''}
      ${pre.length ? `<div class="pre-label">SITUATION</div><div class="block">${pre.map(segHtml).join('')}</div>` : ''}
      <div class="qhead"><h2>${esc(q.id)}</h2><span class="time">🎙 ${q.seconds}초 ${esc(q.note)}</span></div>
      <div class="block">${body.map(segHtml).join('')}</div>

      <div class="controls">
        ${phase === 'playing' || phase === 'answering'
          ? `<button class="btn" id="stop">■ ${phase === 'answering' ? '응답 끝' : '멈춤'}</button>`
          : `<button class="btn primary" id="start">▶ ${phase === 'done' ? '처음부터 다시' : '시작'}</button>`}
        <button class="btn" id="again" ${used || phase === 'idle' || phase === 'playing' ? 'disabled' : ''}>Say again ${used ? '(사용함)' : '(1회)'}</button>
        <div class="timer"><div class="bar" id="bar"><div></div></div><span id="left">${q.seconds}s</span></div>
      </div>
      <div class="status" id="status"></div>

      <textarea id="answer" placeholder="말하면 여기에 바로 들어옵니다. 말할 수 없는 상황이면 직접 타이핑하세요.">${esc(answers[q.id] || '')}</textarea>
      <div class="live" id="live"></div>
      <div class="heard" id="heard"></div>
      <div class="rec" id="rec"></div>

      ${model ? `<details class="model"><summary>모범답안 보기</summary>${esc(model)}</details>` : ''}

      <div class="nav-row">
        <button class="btn" id="prev" ${idx === 0 ? 'disabled' : ''}>← 이전</button>
        <button class="btn" id="next" ${idx === flat.length - 1 ? 'disabled' : ''}>다음 →</button>
      </div>`;

    $('start')?.addEventListener('click', start);
    $('stop')?.addEventListener('click', () => (phase === 'answering' ? finish(false) : (stopAll(), phase = 'idle', render())));
    $('again').addEventListener('click', sayAgain);
    $('prev').addEventListener('click', () => go(idx - 1));
    $('next').addEventListener('click', () => go(idx + 1));
    $('answer').addEventListener('input', (e) => {
      answers[q.id] = e.target.value; store.set('answers', answers); renderNav();
      queueSubmit(q);
    });
    renderRecording();
    renderHeard();
    renderNav();
  }


  function renderRecording() {
    const rec = recordings[flat[idx].id];
    const box = $('rec'); if (!box) return;
    box.innerHTML = (rec
      ? `내 녹음 <audio controls src="${rec.url}"></audio> <a href="${rec.url}" download="${DATA.set}_${flat[idx].id}.webm">저장</a> `
      : '') + `<span class="sent" id="sent"></span>`;
    renderSent();
  }

  function renderNav() {
    let html = '', lastSec = -1;
    flat.forEach((q, i) => {
      if (q.si !== lastSec) {
        if (lastSec !== -1) html += '</div>';
        html += `<div class="sec">${esc(DATA.sections[q.si].title.replace(/\..*$/, ''))}</div><div class="chips">`;
        lastSec = q.si;
      }
      const cls = [(answers[q.id] || '').trim() ? 'answered' : '', i === idx ? 'current' : ''].join(' ');
      html += `<button class="${cls}" data-i="${i}">${esc(q.id.split('-')[1])}</button>`;
    });
    $('nav').innerHTML = html + '</div>';
    $('nav').querySelectorAll('button').forEach((b) => b.addEventListener('click', () => go(+b.dataset.i)));
  }

  function setTimer(left, total) {
    const bar = $('bar'); if (!bar) return;
    bar.firstElementChild.style.width = `${(1 - left / total) * 100}%`;
    bar.classList.toggle('low', left <= 5);
    $('left').textContent = `${Math.ceil(left)}s`;
  }
  const setStatus = (msg) => { const s = $('status'); if (s) s.textContent = msg; };

  /* ───────── md 내보내기 ───────── */

  function filledMarkdown() {
    const out = [];
    let cur = null, skipping = false;
    for (const line of DATA.raw.split(/\r?\n/)) {
      const m = line.trim().match(/^\*\*(P\d[ABC]-Q\d+)\*\*/);
      if (m) cur = m[1];
      if (skipping) {
        if (line.trim() === '---') { out.push('', line); skipping = false; }
        continue;
      }
      out.push(line);
      if (line.trim() === '[정답]' && cur && (answers[cur] || '').trim()) {
        out.push(answers[cur].trim());
        skipping = true;
      }
    }
    return out.join('\n');
  }

  $('copyMd').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(filledMarkdown()); $('footStatus').textContent = '복사했습니다.'; }
    catch { $('footStatus').textContent = '복사 실패 — md 다운로드를 쓰세요.'; }
  });
  $('downloadMd').addEventListener('click', () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([filledMarkdown()], { type: 'text/markdown' }));
    a.download = `${DATA.set}.md`;
    a.click();
  });
  $('reset').addEventListener('click', () => {
    if (!confirm('이 세트의 답안과 Say again 기록을 지울까요?')) return;
    for (const k of Object.keys(answers)) delete answers[k];
    for (const k of Object.keys(sayAgainUsed)) delete sayAgainUsed[k];
    for (const k of Object.keys(sent)) delete sent[k];
    store.set('answers', answers); store.set('sayagain', sayAgainUsed);
    session = stamp(); store.set('session', session);
    go(0);
  });

  /* ───────── 이탈 시 저장 ───────── */

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      clearTimeout(typeTimer); flushAll({ keepalive: true });
      wakeOff({ keep: true });          // OS 가 이미 풀었을 수 있다 — 상태만 남겨 둔다
    } else if (wakeWanted) {
      wakeOn();                         // 돌아왔으면 다시 잡는다
    }
  });
  window.addEventListener('pagehide', () => {
    clearTimeout(typeTimer); flushAll({ keepalive: true });
    wakeOff();
  });

  $('syncAll').addEventListener('click', async () => {
    if (!token) {
      $('footStatus').textContent = '비밀키가 없어 서버로 못 보냅니다 — md 다운로드를 쓰세요.';
      return;
    }
    clearTimeout(typeTimer);
    $('footStatus').textContent = '보내는 중…';
    const { ok, fail, todo } = await flushAll();
    $('footStatus').textContent = todo === 0
      ? '보낼 것이 없습니다 (모두 저장됨).'
      : `${ok}문항 저장${fail ? `, ${fail}문항 실패` : ''}`;
  });

  function showKeyState() {
    $('nokey').hidden = !!token;
  }
  showKeyState();
  $('mineLink').href = '/r/?set=' + encodeURIComponent(DATA.set);

  $('relogin').addEventListener('click', () => {
    window.eptaForget();
    window.eptaGate((tok) => {
      token = tok;
      showKeyState();
      $('footStatus').textContent = '로그인했습니다. 이제 서버로 보낼 수 있습니다.';
      flushAll();                       // 그동안 못 보낸 답안을 올린다
    });
  });

  // 들어올 때 비밀번호를 확인하고 키를 받는다
  window.eptaGate((tok) => {
    token = tok;
    showKeyState();
    flushAll();                         // 로컬에만 남아 있던 답안이 있으면 올린다
  });

  /* ───────── 옵션 ───────── */

  const bindOpt = (id, name) => {
    $(id).checked = opts[name];
    $(id).addEventListener('change', (e) => { opts[name] = e.target.checked; store.set('opts', opts); render(); });
  };
  bindOpt('optScript', 'script');
  bindOpt('optSpeech', 'speech');
  bindOpt('optAudio', 'audio');
  bindOpt('optAutoStart', 'autoStart');

  $('optWake').checked = opts.wake;
  $('optWake').addEventListener('change', (e) => {
    opts.wake = e.target.checked; store.set('opts', opts);
    if (opts.wake) { if (wakeWanted) wakeOn(); } else wakeOff();
  });
  if (!wakeSupported) {
    $('optWake').checked = false;
    $('optWake').disabled = true;
    $('optWakeLabel').title = '이 브라우저는 화면 켜두기(Screen Wake Lock)를 지원하지 않습니다 — '
      + 'iOS 는 16.4 이상, 설정 ▸ 디스플레이 ▸ 자동 잠금을 길게 두세요.';
  }

  render();
})();
</script>
</body>
</html>
