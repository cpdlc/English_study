<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WEAK_04 연습</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #1d2330; --muted: #6b7384; --line: #e2e5ea;
    --accent: #2459d6; --accent-soft: #e6edfc; --atc: #0f7a55; --atc-soft: #e3f4ec;
    --warn: #b4531c; --warn-soft: #fbeee5; --done: #2e8b57; --screen: #111827; --screen-text: #7df9c1;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151b; --card: #1b2029; --text: #e6e9ef; --muted: #939bab; --line: #2c3340;
      --accent: #6d9bff; --accent-soft: #1f2a44; --atc: #4fd19a; --atc-soft: #183229;
      --warn: #f09a62; --warn-soft: #3a2518; --done: #5fcf8c; --screen: #0a0d12; --screen-text: #7df9c1;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.6 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--line);
           padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
  header h1 { font-size: 17px; margin: 0; }
  header .home { color: var(--accent); text-decoration: none; font-size: 14px; white-space: nowrap; }
  header .mine { color: var(--accent); text-decoration: none; font-size: 13px; }
  header .progress { color: var(--muted); font-size: 13px; }
  header .opts { margin-left: auto; display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; }
  header label { cursor: pointer; user-select: none; }
  .layout { display: grid; grid-template-columns: 240px 1fr; gap: 16px; max-width: 1100px;
            margin: 16px auto; padding: 0 16px; }
  nav { align-self: start; position: sticky; top: 64px; background: var(--card); border: 1px solid var(--line);
        border-radius: 10px; padding: 10px; max-height: calc(100vh - 80px); overflow: auto; }
  nav .sec { font-size: 12px; font-weight: 600; color: var(--muted); margin: 8px 2px 4px; }
  nav .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  nav button { border: 1px solid var(--line); background: transparent; color: var(--text); border-radius: 6px;
               font-size: 12px; padding: 2px 7px; cursor: pointer; }
  nav button.answered { background: var(--accent-soft); border-color: var(--accent); }
  nav button.current { outline: 2px solid var(--accent); font-weight: 700; }
  main { min-width: 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
  .sec-title { font-size: 13px; color: var(--muted); font-weight: 600; }
  details.dir { margin: 6px 0 12px; font-size: 13px; color: var(--muted); }
  details.dir summary { cursor: pointer; }
  .qhead { display: flex; align-items: baseline; gap: 10px; margin: 8px 0 12px; }
  .qhead h2 { margin: 0; font-size: 22px; }
  .qhead .time { color: var(--muted); }
  .block { margin: 10px 0; }
  .seg { padding: 8px 12px; border-radius: 8px; margin: 6px 0; }
  .seg.narration { background: var(--bg); }
  .seg.instruction { background: var(--accent-soft); font-weight: 600; }
  .seg.atc { background: var(--atc-soft); }
  .seg.atc b { color: var(--atc); }
  .seg.hidden { color: var(--muted); font-style: italic; }
  .seg.playing { outline: 2px solid var(--accent); }
  .seg.chime { background: transparent; color: var(--muted); padding: 2px 12px; }
  /* 실제 응시 화면의 상단 하늘색 띠 */
  .cuebar { background: #e8f4fb; border: 1px solid #b9d9ee; border-bottom-width: 3px;
            border-radius: 6px; padding: 10px 14px; margin: 0 0 14px; }
  .cuebar .cue { color: #1a5fa8; font-weight: 700; }
  .cuebar .cue + .cue { margin-top: 4px; }
  .cuebar .tag { color: #c02626; font-weight: 700; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .cuebar { background: #10212e; border-color: #1f4a66; }
  }
  .screen { background: var(--screen); color: var(--screen-text); font-family: ui-monospace, Consolas, monospace;
            padding: 10px 14px; border-radius: 8px; margin: 8px 0; }
  .pre-label { font-size: 12px; color: var(--muted); font-weight: 600; margin-top: 4px; }
  img.fig { max-width: 100%; border-radius: 8px; border: 1px solid var(--line); background: #fff; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 16px 0 10px; }
  button.btn { border: 1px solid var(--line); background: var(--card); color: var(--text); padding: 8px 14px;
               border-radius: 8px; cursor: pointer; font-size: 14px; }
  button.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.btn:disabled { opacity: .45; cursor: default; }
  .timer { flex: 1; min-width: 160px; display: flex; align-items: center; gap: 8px; }
  .bar { flex: 1; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .2s linear; }
  .bar.low > div { background: var(--warn); }
  .timer span { font-variant-numeric: tabular-nums; min-width: 42px; text-align: right; }
  .status { font-size: 13px; color: var(--muted); min-height: 20px; }
  textarea { width: 100%; min-height: 90px; border: 1px solid var(--line); border-radius: 8px; padding: 10px;
             font: inherit; background: var(--bg); color: var(--text); resize: vertical; }
  .nokey { max-width: 1100px; margin: 12px auto 0; padding: 10px 14px; border-radius: 8px;
           background: var(--warn-soft); color: var(--warn); font-size: 13px; }
  .nokey .btn { padding: 5px 10px; font-size: 13px; margin-left: 4px; }
  .live { font-size: 13px; color: var(--accent); min-height: 19px; font-style: italic; margin: 4px 0; }
  .heard { margin: 8px 0; padding: 9px 12px; border-radius: 8px; background: var(--atc-soft);
           font-size: 14px; }
  .heard b { display: block; font-size: 11px; letter-spacing: .04em; color: var(--muted);
             margin-bottom: 3px; }
  .heard .use { margin-left: 8px; font-size: 12px; }
  .rec { margin: 8px 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; }
  .sent { font-size: 12px; color: var(--muted); }
  .sent.ok { color: var(--done); }
  .sent.bad { color: var(--warn); }
  .rec audio { height: 34px; }
  details.model { margin-top: 12px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
  details.model summary { cursor: pointer; font-weight: 600; color: var(--done); }
  .nav-row { display: flex; justify-content: space-between; margin-top: 16px; gap: 8px; }
  .footer { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 40px; }
  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
    nav { position: static; max-height: none; }
    header .opts { margin-left: 0; }
  }
</style>
</head>
<body>
<header>
  <a class="home" href="/">← 목록</a>
  <h1 id="title"></h1>
  <span class="progress" id="progress"></span>
  <div class="opts">
    <label><input type="checkbox" id="optScript"> 스크립트 보기</label>
    <label><input type="checkbox" id="optSpeech" checked> 음성 인식</label>
    <label><input type="checkbox" id="optAudio" checked> 녹음 저장</label>
    <label><input type="checkbox" id="optAutoStart"> 다음 문항 자동 시작</label>
    <label id="optWakeLabel"><input type="checkbox" id="optWake" checked> 화면 켜두기</label>
    <a class="mine" id="mineLink" href="/r/">내 답안 보기 →</a>
  </div>
</header>

<p class="nokey" id="nokey" hidden>⚠ <b>서버 저장이 꺼져</b> 있습니다. 답안은 이 브라우저에만
   남습니다. <button class="btn" id="relogin">비밀번호 다시 입력</button></p>

<div class="layout">
  <nav id="nav"></nav>
  <main>
    <div class="card" id="card"></div>
    <div class="footer">
      <button class="btn" id="copyMd">답안 넣은 md 복사</button>
      <button class="btn" id="downloadMd">md 다운로드</button>
      <button class="btn" id="syncAll">모든 답안 서버로 저장</button>
      <button class="btn" id="reset">답안 초기화</button>
      <span class="status" id="footStatus"></span>
    </div>
  </main>
</div>

HL123, Ulsan Approach, radar contact. I've got nothing on you — say the visibility you need and the number of persons on board.", "src": "/audio/WEAK_04/ce6dd2d33803045c.mp3"}, {"type": "say", "voice": "atc", "label": "ATC", "text": "HL123, I've got a departure ahead of you, so I can give you a tree zero mile downwind for the ILS. Can you accept that?", "src": "/audio/WEAK_04/af12badb2f50ee2a.mp3"}, {"type": "say", "voice": "atc", "label": "ATC", "text": "HL123, you've had a while to work on it, so I take it your autoland is back. Is that right, and do you want to declare an emergency?", "src": "/audio/WEAK_04/731768b1676cb18c.mp3"}, {"type": "say", "voice": "atc", "label": "ATC", "text": "HL123, the fire service want two figures before you land — say again your fuel endurance and the number of persons on board.", "src": "/audio/WEAK_04/4ff92b82303596b6.mp3"}, {"type": "say", "voice": "atc", "label": "ATC", "text": "HL123, turn left heading tree six zero, descend to 2,500 feet until established, cleared for the ILS runway tree six approach, contact Ulsan Tower on one one eight decimal tree.", "src": "/audio/WEAK_04/4de97affc8f520cb.mp3"}, {"type": "chime"}, {"type": "say", "voice": "narrator", "kind": "instruction", "text": "Now answer the questions.", "src": "/audio/WEAK_04/54a523a246e18a47.mp3"}], "body": [{"type": "say", "voice": "narrator", "kind": "narration", "text": "What happened to your aircraft (HL123)? Explain the nature of the incident.", "src": "/audio/WEAK_04/15c954430348f1b2.mp3"}], "hints": ["Pohang", "Approach", "TOBRA", "ONE", "ILS", "Ulsan", "What", "Can", "Tower", "Hotel Lima one two three", "affirm", "negative", "unable", "wilco", "roger", "say again", "standby", "request", "readback", "squawk", "flight level", "heading", "altimeter", "knots", "Mach", "runway", "taxiway", "holding point", "hold short", "line up and wait", "cleared for takeoff", "cleared to land", "go around", "vectors", "troubleshooting", "souls on board", "minimum fuel", "mayday", "pan pan", "PIREP", "turbulence", "icing", "wake turbulence", "QNH", "ILS", "RNAV", "SID", "transition", "intercept", "localizer", "established", "expedite", "backtrack", "pushback", "start up", "deviation", "offset", "intentions", "descend", "climb", "maintain", "contact", "report", "due to performance", "due to weather", "clear of traffic", "in sight"]}, {"id": "P2C-Q4", "seconds": 90, "note": "", "pre": [], "body": [{"type": "say", "voice": "narrator", "kind": "narration", "text": "How do you think the incident was handled by the air traffic controller? Do you feel the situation could have been handled differently? Make a comment from a pilot's point of view.", "src": "/audio/WEAK_04/a0bd8a27f261ce2d.mp3"}], "hints": ["How", "Hotel Lima one two three", "affirm", "negative", "unable", "wilco", "roger", "say again", "standby", "request", "readback", "squawk", "flight level", "heading", "altimeter", "knots", "Mach", "runway", "taxiway", "holding point", "hold short", "line up and wait", "cleared for takeoff", "cleared to land", "go around", "vectors", "troubleshooting", "souls on board", "minimum fuel", "mayday", "pan pan", "PIREP", "turbulence", "icing", "wake turbulence", "QNH", "ILS", "RNAV", "SID", "transition", "intercept", "localizer", "established", "expedite", "backtrack", "pushback", "start up", "deviation", "offset", "intentions", "descend", "climb", "maintain", "contact", "report", "due to performance", "due to weather", "clear of traffic", "in sight"]}]}], "set": "WEAK_04", "raw": "# EPTA 약점 집중 세트 04 — 2026-11-06\n\n안 내 실전 모의세트가 아니다. WEAK_03 과 같은 약점을 **test04 계열**로 다시 낸다 — 실제 출제\n음성 네 세트 중 한 세트는 **`tree` = 3** 을 전편에 쓰고 **한국 지명**을 섞는다. 숫자 발음이\n달라지면 받아적기가 무너지는지 보는 것이 이 세트의 추가 목적이다. 지시문도 test04 처럼\n**기능 두세 개를 한 문장에** 넣는다.\n답에 꼭 필요한 앞선 교신은 **실제 문항으로** 넣었다 — 거기서 듣거나 말한 값을 **적어 두고 다음\n문항에서 쓴다.** 입으로 불러야 하는 **기관명은 전부 화면에 띄웠다.**\n메모 가능 / 문항당 1회 Say again. 응시자 콜사인은 항상 **HL123**.\n**채점할 때 `tree` 와 `three` 는 둘 다 정답이다.**\n\n| 파트 | 겨냥하는 유형 | 문항 | 이어지는 문항 (앞 → 뒤) |\n|---|---|---:|---|\n| A | **복창 + α** (`tree` 로 듣기) | 9 | Q1 → Q2 · Q4 → Q5 · Q6 → Q7 · Q8 → Q9 |\n| B | **상한·하한 + 어휘** (required ↔ available) | 7 | Q5 → Q6 |\n| C | **값 유지** (되묻기 3회, 11턴) | 11 | 전체가 이어진다 |\n| D | **발신** (기관 호출 · 확인 요청) | 7 | Q3 → Q4 |\n| E | **90초 자유응답** (C 파트에 대해 답한다) | 4 | C → 전체 |\n\n---\n\n## 약점 A. 복창 + α\n\n✅ Directions : You will be listening to ATC instructions and making calls of your own. The numbers\nare spoken the ICAO way — **`tree` is three.** Most questions ask you to do **more than read back.**\nSome questions continue from the question before, so keep your notes. Your callsign is HL123.\n\"Say again (=Repeat)\" available once only.\n  * Response time for each question : 20 or 30 seconds, as shown\n\n**P1A-Q1** 🎙 20초\n🖥 [ Jeju / NASIK TWO departure ]\nDelivery : HL123, cleared to Jeju via the NASIK TWO departure, flight level tree tree zero, squawk two tree seven one.\n\nRecord your full readback.\n\n[정답]\n\n\n---\n\n**P1A-Q2** 🎙 30초\nThe loading is still being finalised and you will not be ready to taxi for eight minutes.\nGround : HL123, say again your cleared level and your squawk, and report when you are ready to taxi.\n\nAnswer both of his questions, acknowledge his request, and tell him how long you need.\n\n[정답]\n\n\n---\n\n**P1A-Q3** 🎙 30초\nYou are descending through 9,000 feet. **The aircraft has a placard today limiting you to two five\nzero knots below one zero thousand feet.**\nApproach : HL123, maintain two niner zero knots until one five miles.\n\nGive a full readback, and tell him what you can do instead, with a reason.\n\n[정답]\n\n\n---\n\n**P1A-Q4** 🎙 20초\nTower : HL123, after the landing Boeing 737-800, line up and wait runway tree four.\n\nRecord your full readback.\n\n[정답]\n\n\n---\n\n**P1A-Q5** 🎙 30초\nThe 737 has landed and vacated, and you are lined up. The cabin crew call — a passenger has stood\nup and opened an overhead bin. They need one minute to get him seated and the cabin secure.\nTower : HL123, wind tree two zero at seven, cleared for takeoff runway tree four.\n\nGive a full readback, tell him what you cannot do with a reason, and tell him how long you need.\n\n[정답]\n\n\n---\n\n**P1A-Q6** 🎙 30초\n🖥 [ Ulsan Approach / YUDAM ]\nYou are level at flight level two four zero, tree five miles from YUDAM, inbound to Ulsan. The\ninner pane of a cabin window has cracked. The outer pane is intact and the cabin is holding\npressure, but you want to descend to one zero thousand feet and land as soon as you can.\nContact Ulsan Approach.\n\nReport your status and make a request with a reason.\n\n[정답]\n\n\n---\n\n**P1A-Q7** 🎙 30초\nYou have one eight two persons on board. The cabin is holding pressure and the crew are not\nworried, so you do not want to declare an emergency.\nApproach : HL123, roger, descend to flight level one tree zero, turn left heading tree five zero,\nvectors for Ulsan. Do you want to declare an emergency, and how many persons on board?\n\nGive a full readback, and answer both of his questions.\n\n[정답]\n\n\n---\n\n**P1A-Q8** 🎙 20초\nApproach : HL123, cross YUDAM at or above flight level one five zero, speed two tree zero knots or less.\n\nRecord your full readback.\n\n[정답]\n\n\n---\n\n**P1A-Q9** 🎙 30초\nYour present profile will put you at flight level one four zero at YUDAM, and you are doing two\nfive zero knots. You can level off now, and you can reduce, but you need to be told which he wants\nfirst.\nApproach : HL123, confirm you can make both of the YUDAM restrictions?\n\nRespond accordingly, and tell him what you need for each one.\n\n[정답]\n\n\n---\n\n## 약점 B. 상한·하한 + 어휘\n\n✅ Directions : In each question you are given **one of your own limits.** Read it carefully —\nsometimes it is a **maximum** and sometimes it is a **minimum**. **Decide, say why, and give the\ncontroller both figures.** One question continues from the question before. Your callsign is HL123.\n  * Response time for each question : 20 or 30 seconds, as shown\n\n**P1B-Q1** 🎙 30초\n**The shortest runway you can use at today's landing weight is 2,600 metres.**\nApproach : HL123, Pohang runway tree two has 2,400 metres available. Can you take it?\n\nRespond accordingly with a reason.\n\n[정답]\n\n\n---\n\n**P1B-Q2** 🎙 30초\n**Your maximum tailwind for landing is one zero knots.**\nTower : HL123, runway tree four, wind one five zero at one five. Can you accept?\n\nRespond accordingly with a reason.\n\n[정답]\n\n\n---\n\n**P1B-Q3** 🎙 30초\n**Your required landing distance today is 2,200 metres.** You do not yet know what the runway gives\nyou, and you want to be told.\nApproach : HL123, say the landing distance you need, and I'll tell you what we have.\n\nAnswer his question, and make a request.\n\n[정답]\n\n\n---\n\n**P1B-Q4** 🎙 30초\nYou can accept a short approach as long as you are below two tree zero knots at five miles, and\ntoday you can do that.\nApproach : HL123, I can give you a short approach to runway one tree — it saves you one four\nminutes, but you'd be high on the profile. Can you take it?\n\nRespond accordingly with a reason.\n\n[정답]\n\n\n---\n\n**P1B-Q5** 🎙 20초\n🖥 [ GWANO ]\nApproach : HL123, hold at GWANO, right turns, maintain flight level one tree zero, expect further clearance at zero tree four five.\n\nRecord your full readback.\n\n[정답]\n\n\n---\n\n**P1B-Q6** 🎙 30초\nIt is now zero tree two five. Your fuel endurance is one hour two zero minutes and your diversion\nto Wonju needs four zero minutes. You would rather stay if your fuel allows it.\nApproach : HL123, are you able to accept that, or do you want to divert now?\n\nRespond accordingly with a reason, and give him your figures.\n\n[정답]\n\n\n---\n\n**P1B-Q7** 🎙 30초\n🖥 [ Ulsan / Wonju ]\n**Your required landing distance is 1,900 metres** and your crew duty time expires in five five\nminutes.\nApproach : HL123, Ulsan runway tree four has 2,800 metres but you'd be tree five minutes. Wonju has\n2,100 metres, one two minutes. What would you like?\n\nRespond accordingly with a reason, and say what you want.\n\n[정답]\n\n\n---\n\n## 약점 C. 값 유지 — 되묻기 롤플레이\n\n✅ Directions : In Part C you will be interacting with an Air traffic controller through eleven\nturns. **The controller will ask you for your figures three times during the scenario, and some of\nthem will have changed by then.** Follow the prompts and respond as necessary. \"Say again\n(=Repeat)\" available only once. Your callsign is HL123.\n  * Response time for each question : 30 seconds or less\n\nInitial Situation You are the pilot of HL123, descending through flight level one niner zero for\none four thousand, 50 miles from TOBRA, inbound to Pohang Airport. Your fuel endurance is one hour\nfive five minutes and there are one tree two persons on board. Your required landing distance is\n2,000 metres, and your autoland is serviceable. 🔔(dingdong)\n\n**P2A-Q1** 🎙 30초\n🖥 [ Pohang Approach / TOBRA ]\n☞ Contact Pohang Approach, report your position and level, and request descent.\n\n[정답]\n\n\n---\n\n**P2A-Q2** 🎙 30초\n🖥 [ TOBRA ONE arrival ]\n☞ Listen to the controller, give a full readback, and inquire about the present visibility.\nApproach : HL123, Pohang Approach, descend to one tree thousand, expect the TOBRA ONE arrival,\nILS runway tree two. Be advised, visibility is reducing in mist.\n\n[정답]\n\n\n---\n\nSituation Update Passing one two thousand feet you get a GEN 1 FAULT caption, and your APU is\nunavailable, so you are on a single generator. **Your autoland is no longer available**, so you\nneed to fly it by hand and **your minimum visibility is now 1,200 metres.** If the second generator\nfails you have **tree zero minutes on batteries**, so you want to be on the ground inside tree zero\nminutes, and you have decided you will not hold for more than one zero minutes. The remaining\ngenerator is working normally, so **you do not want to declare an emergency** — but you do want the\nfire service standing by, and the shortest taxi in after landing. 🔔(dingdong)\n\n**P2A-Q3** 🎙 30초\n☞ Report your problem to the controller, tell him both things that have changed, and make a request\nwith a reason.\n\n[정답]\n\n\n---\n\n**P2A-Q4** 🎙 30초\n🖥 [ Pohang / Ulsan / visibility ]\n☞ Listen to the controller, state your decision with a reason, and tell him the figure you need.\nApproach : HL123, Pohang visibility is now 900 metres. Ulsan has 4,000 metres and it's one five\nminutes away. What would you like?\n\n[정답]\n\n\n---\n\n**P2A-Q5** 🎙 30초\n☞ Listen to the controller and provide the requested information.\nApproach : HL123, roger, I'm passing you to Ulsan. Say your fuel endurance and the number of\npersons on board.\n\n[정답]\n\n\n---\n\n**P2A-Q6** 🎙 30초\n🖥 [ Ulsan Approach ]\n☞ Listen to the controller, give a full readback and say your intentions.\nApproach : HL123, turn right heading tree one zero, descend to 8,000 feet, vectors for Ulsan,\ncontact Ulsan Approach on one two one decimal tree five. Say your intentions.\n\n[정답]\n\n\n---\n\n**P2A-Q7** 🎙 30초\n☞ You are now with a new controller who has none of your figures. Listen to him and answer both of\nhis questions.\nApproach : HL123, Ulsan Approach, radar contact. I've got nothing on you — say the visibility you\nneed and the number of persons on board.\n\n[정답]\n\n\n---\n\n**P2A-Q8** 🎙 30초\n☞ Listen to the controller, tell him whether you can accept that with a reason, and tell him what\nyou want instead.\nApproach : HL123, I've got a departure ahead of you, so I can give you a tree zero mile downwind\nfor the ILS. Can you accept that?\n\n[정답]\n\n\n---\n\n**P2A-Q9** 🎙 30초\n☞ Listen to the controller and answer both of his questions.\nApproach : HL123, you've had a while to work on it, so I take it your autoland is back. Is that\nright, and do you want to declare an emergency?\n\n[정답]\n\n\n---\n\n**P2A-Q10** 🎙 30초\n☞ Listen to the controller and provide the requested information.\nApproach : HL123, the fire service want two figures before you land — say again your fuel endurance\nand the number of persons on board.\n\n[정답]\n\n\n---\n\n**P2A-Q11** 🎙 30초\n🖥 [ Ulsan Tower ]\n☞ Listen to the controller, give a full readback, and say what you will need after landing.\nApproach : HL123, turn left heading tree six zero, descend to 2,500 feet until established, cleared\nfor the ILS runway tree six approach, contact Ulsan Tower on one one eight decimal tree.\n\n[정답]\n\n\n---\n\n## 약점 D. 발신 — 기관 호출 · 확인 요청\n\n✅ Directions : In Part D you usually call first, with **no controller transmission.** Each situation\ntells you exactly what you want — **read it to the end before you speak.** One question continues\nfrom the question before. Your callsign is HL123.\n  * Response time for each question : 20 seconds or less\n\n**P2B-Q1** 🎙 20초\n🖥 [ Daejeon Control / SEORA ]\nYou are level at flight level tree seven zero. The temperature is five degrees warmer than planned\nand you cannot hold your planned Mach number without eating into your reserve. At flight level tree\ntree zero you can. You want flight level tree tree zero. Contact Daejeon Control.\n\nReport your situation and make a request with a reason.\n\n[정답]\n\n\n---\n\n**P2B-Q2** 🎙 20초\n🖥 [ Ulsan Delivery / NASIK TWO departure / SEORA ]\nYour flight plan has you on the NASIK TWO departure, but it routes you through embedded\nthunderstorms. You want a straight-out departure from runway tree four and then direct SEORA.\nContact Ulsan Delivery.\n\nReport your situation and make a request.\n\n[정답]\n\n\n---\n\n**P2B-Q3** 🎙 20초\nGround : HL123, taxi to holding point Alpha tree via Golf and Hotel, hold short of runway tree four.\n\nRecord your full readback.\n\n[정답]\n\n\n---\n\n**P2B-Q4** 🎙 20초\nYou are holding short of runway tree four as instructed. The cabin crew call — the forward left door\nslide is showing a fault on the cabin panel, and maintenance must look at it before you depart.\n**You are already with Ground.**\n\nReport your status and make a request.\n\n[정답]\n\n\n---\n\n**P2B-Q5** 🎙 20초\n🖥 [ Pohang Approach ]\nYou are being vectored for the ILS runway tree two. The first officer has just noticed that the\naltimeter setting you were given does not agree with your ATIS printout — the ATIS says one zero\none tree and you were given one zero zero tree. You want it checked before you descend any further.\nContact Pohang Approach.\n\nMake a confirmation request with a reason.\n\n[정답]\n\n\n---\n\n**P2B-Q6** 🎙 20초\n🖥 [ Ulsan Tower ]\nYou landed one minute ago on runway tree six and you are clear of the runway. A tyre on the nose\ngear is making a loud noise and the aircraft is pulling to the left. You want to stop where you are\nand be towed in. Contact Ulsan Tower.\n\nReport your status and make a request.\n\n[정답]\n\n\n---\n\n**P2B-Q7** 🎙 20초\n🖥 [ Daejeon Control / GWANO ]\nTwo zero miles east of GWANO at flight level tree one zero, a small unmanned aircraft passed about\n500 feet below you. There was nothing on your TCAS and you took no avoiding action. You want the\ncontroller to know. **You need nothing for yourself.** Contact Daejeon Control.\n\nMake a report.\n\n[정답]\n\n\n---\n\n## 약점 E. 90초 자유응답\n\n✅ Directions : You will be asked four questions about Part C. **You have up to 90 seconds for\neach.** Answer every part of the question, and finish the part that asks for an example.\n\n**P2C-Q1** 🎙 90초\nFollow up question.\n\nIn this situation the controller asked you for the same two figures twice, and in between them he\nasked you for a figure that had changed. Which figure had changed, and which had not? In your role\nas a pilot, how do you lay your notes out so that a figure you have already given can be read back\nwithout hunting for it? Give an example.\n\n[정답]\n\n\n\n\n---\n\n**P2C-Q2** 🎙 90초\nFollow up question.\n\nIn this situation you had a limit that was a clock — tree zero minutes on batteries — and you had\nto turn it down when the controller offered you a long track. How do you explain a limit like that\nto a controller so that he can work with it? From your own experiences, what happens when a pilot\naccepts something he has no margin for? Give an example.\n\n[정답]\n\n\n\n\n---\n\n☞ Now listen to the controller's radiotelephony messages.\n\nATC: HL123, Pohang Approach, descend to one tree thousand, expect the TOBRA ONE arrival,\nILS runway tree two. Be advised, visibility is reducing in mist.\nATC: HL123, Pohang visibility is now 900 metres. Ulsan has 4,000 metres and it's one five\nminutes away. What would you like?\nATC: HL123, roger, I'm passing you to Ulsan. Say your fuel endurance and the number of\npersons on board.\nATC: HL123, turn right heading tree one zero, descend to 8,000 feet, vectors for Ulsan,\ncontact Ulsan Approach on one two one decimal tree five. Say your intentions.\nATC: HL123, Ulsan Approach, radar contact. I've got nothing on you — say the visibility you\nneed and the number of persons on board.\nATC: HL123, I've got a departure ahead of you, so I can give you a tree zero mile downwind\nfor the ILS. Can you accept that?\nATC: HL123, you've had a while to work on it, so I take it your autoland is back. Is that\nright, and do you want to declare an emergency?\nATC: HL123, the fire service want two figures before you land — say again your fuel endurance\nand the number of persons on board.\nATC: HL123, turn left heading tree six zero, descend to 2,500 feet until established, cleared\nfor the ILS runway tree six approach, contact Ulsan Tower on one one eight decimal tree. 🔔(dingdong)\n\n☞ Now answer the questions.\n\n**P2C-Q3** 🎙 90초\nWhat happened to your aircraft (HL123)? Explain the nature of the incident.\n\n[정답]\n\n\n\n\n---\n\n**P2C-Q4** 🎙 90초\nHow do you think the incident was handled by the air traffic controller? Do you feel the situation\ncould have been handled differently? Make a comment from a pilot's point of view.\n\n[정답]\n\n\n\n\n---\n", "answers": {}}</script>
<script>
(() => {
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const KEY = 'epta:' + DATA.set;
  const PAUSE_MS = 600;

  const flat = [];
  DATA.sections.forEach((sec, si) => sec.questions.forEach((q, qi) => flat.push({ ...q, si, first: qi === 0 })));

  const store = {
    get(name, fallback) {
      try { return JSON.parse(localStorage.getItem(KEY + ':' + name)) ?? fallback; } catch { return fallback; }
    },
    set(name, value) { try { localStorage.setItem(KEY + ':' + name, JSON.stringify(value)); } catch {} },
  };

  const answers = store.get('answers', {});
  const sayAgainUsed = store.get('sayagain', {});
  const recordings = {};                 // id → blob URL (이 탭에서만)
  const opts = store.get('opts', { script: false, speech: true, audio: true, autoStart: false, wake: true });
  opts.wake ??= true;                   // 예전에 저장된 설정에도 기본값을 준다
  // 녹음이 기본 꺼짐이던 때 저장된 설정을 한 번만 켜준다
  if (!store.get('optsV2', false)) {
    opts.audio = true; opts.speech = true;
    store.set('opts', opts); store.set('optsV2', true);
  }

  function stamp() {
    const d = new Date(), z = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}${z(d.getMonth() + 1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}`;
  }

  // 응시 세션 — 서버에 이 묶음으로 저장된다. '답안 초기화' 하면 새 세션이 열린다.
  let session = store.get('session', '');
  if (!session) { session = stamp(); store.set('session', session); }

  // 서버 비밀키는 들어올 때 비밀번호를 확인한 서버가 내려준다 (gate.js → /api/login).
  // HTML 소스에도, 주소에도 들어가지 않는다.
  let token = '';

  let idx = Math.min(store.get('idx', 0), flat.length - 1);
  let phase = 'idle';                    // idle | playing | answering | done
  let revealed = false;
  let runId = 0;                         // 재생·타이머 취소용
  let timerHandle = null;
  let recorder = null, micStream = null;
  let recog = null, recogFinal = '', recogBase = '';
  let recStop = null;                    // 녹음 마무리를 기다리는 약속
  let speechStarted = false;             // 인식이 실제로 시작됐는지
  let speechError = '';                  // 인식이 실패한 이유
  const sent = {};                       // id → 전송 상태 문자열
  const lastSent = {};                   // id → 서버로 보낸 마지막 글자
  const heard = {};                      // id → 서버가 녹음에서 알아들은 글자
  const sentAudio = {};                  // id → 녹음까지 보냈는지
  let typeTimer = null;

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  /* ───────── 소리 ───────── */

  const player = new Audio();
  let actx = null;
  const ctx = () => (actx ??= new (window.AudioContext || window.webkitAudioContext)());

  function tone(freq, start, dur, gain = 0.25) {
    const c = ctx(), o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(gain, c.currentTime + start);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + start + dur);
    o.connect(g).connect(c.destination);
    o.start(c.currentTime + start); o.stop(c.currentTime + start + dur);
  }
  const chime = () => { tone(784, 0, 0.9); tone(622, 0.45, 1.1); return wait(1600); };
  const beep = () => { tone(1000, 0, 0.35, 0.2); };
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  function playSrc(src) {
    return new Promise((resolve, reject) => {
      player.src = src;
      player.onended = resolve;
      player.onerror = () => reject(new Error('음성 파일을 열 수 없습니다: ' + src));
      player.play().catch(reject);
    });
  }

  async function playSegments(segs, my) {
    for (const seg of segs) {
      if (my !== runId) return false;
      if (seg.type === 'chime') { await chime(); continue; }
      if (seg.type !== 'say') continue;
      const el = document.querySelector(`[data-src="${seg.src}"]`);
      el?.classList.add('playing');
      try { await playSrc(seg.src); } finally { el?.classList.remove('playing'); }
      if (my !== runId) return false;
      await wait(PAUSE_MS);
    }
    return my === runId;
  }

  function stopAll() {
    runId++;
    player.pause();
    clearInterval(timerHandle);
    stopSpeech();
    stopRecording();
  }

  /* ───────── 화면 꺼짐 방지 ─────────
     문제를 듣는 20~30초, 답하는 30~90초 동안 손을 대지 않으므로 화면 자동 잠금이 걸린다.
     첫 '시작' 때 Screen Wake Lock 을 잡고 세트를 끝낼 때까지 들고 있는다.
     브라우저가 탭을 숨기면 OS 가 잠금을 알아서 풀기 때문에, 돌아왔을 때 다시 잡아준다. */

  const wakeSupported = 'wakeLock' in navigator;
  let wakeSentinel = null;              // 지금 잡고 있는 잠금
  let wakeWanted = false;               // 잡고 있어야 하는 상태인가

  async function wakeOn() {
    wakeWanted = true;
    if (!opts.wake || !wakeSupported || wakeSentinel) return;
    if (document.visibilityState !== 'visible') return;
    try {
      wakeSentinel = await navigator.wakeLock.request('screen');
      wakeSentinel.addEventListener('release', () => { wakeSentinel = null; });
    } catch {
      wakeSentinel = null;              // 배터리 절약 모드 등에서는 거부된다
    }
  }

  function wakeOff({ keep = false } = {}) {
    if (!keep) wakeWanted = false;
    wakeSentinel?.release?.().catch(() => {});
    wakeSentinel = null;
  }

  /* ───────── 음성 인식 — 말하면 바로 글자로 ───────── */

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  function startSpeech(id) {
    if (!opts.speech) return;
    if (!SR) { setStatus('이 브라우저는 음성 인식을 지원하지 않습니다 — 타이핑으로 답하세요.'); return; }

    recogBase = (answers[id] || '').trim();   // 이미 적어둔 내용은 보존하고 뒤에 붙인다
    recogFinal = '';
    speechStarted = false;
    speechError = '';
    const r = new SR();
    recog = r;
    r.lang = 'en-US';
    r.continuous = true;
    r.interimResults = true;
    r.maxAlternatives = 1;

    r.onresult = (e) => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const txt = e.results[i][0].transcript.trim();
        if (e.results[i].isFinal) { if (txt) recogFinal += (recogFinal ? ' ' : '') + txt; }
        else interim += txt + ' ';
      }
      const merged = [recogBase, recogFinal].filter(Boolean).join(' ');
      answers[id] = merged;
      store.set('answers', answers);
      const ta = $('answer'); if (ta) ta.value = merged;
      const lv = $('live'); if (lv) lv.textContent = interim ? '… ' + interim : '';
    };

    r.onstart = () => { speechStarted = true; };

    r.onerror = (e) => {
      const why = {
        'not-allowed': '마이크 권한이 거부되었습니다',
        'service-not-allowed': '브라우저가 음성 인식을 막았습니다',
        'network': '음성 인식 서버에 연결할 수 없습니다',
        'audio-capture': '마이크를 잡을 수 없습니다 (녹음과 충돌했을 수 있습니다)',
        'aborted': '',
        'no-speech': '',
      }[e.error] ?? `음성 인식 오류 (${e.error})`;
      if (why) { speechError = why; setStatus(why + ' — 타이핑으로 답하세요.'); }
    };

    // 안드로이드 크롬은 잠깐 조용하면 알아서 끊긴다. 응답시간 동안은 계속 되살린다.
    r.onend = () => { if (recog === r && phase === 'answering') { try { r.start(); } catch {} } };

    try { r.start(); } catch { recog = null; }
  }

  function stopSpeech() {
    const r = recog;
    if (!r) return;
    recog = null;
    r.onend = null;
    try { r.stop(); } catch {}
    const lv = $('live'); if (lv) lv.textContent = '';
  }

  /* ───────── 녹음 (선택 — 나중에 다시 들어보려면) ───────── */

  async function startRecording(id) {
    recStop = null;
    if (!opts.audio) return;
    if (!window.MediaRecorder || !navigator.mediaDevices?.getUserMedia) {
      setStatus('이 브라우저는 녹음을 지원하지 않습니다 — 답안은 글자로만 저장됩니다.');
      return;
    }
    try {
      micStream ??= await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch {
      setStatus('마이크 권한이 없어 녹음을 못 합니다 — 답안은 글자로만 저장됩니다.');
      return;
    }

    // ★ recorder 를 지역 변수로 붙잡는다. 전역만 쓰면 stop 뒤에 null 이 되어
    //   onstop 안에서 터지고 녹음 파일이 만들어지지 않는다.
    let rec;
    try { rec = new MediaRecorder(micStream); }
    catch { setStatus('녹음을 시작할 수 없습니다 — 답안은 글자로만 저장됩니다.'); return; }

    const chunks = [];
    recorder = rec;
    recStop = new Promise((resolve) => {
      rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
      rec.onerror = () => { setStatus('녹음 중 오류가 났습니다 — 글자만 저장됩니다.'); resolve(); };
      rec.onstop = () => {
        if (chunks.length) {
          if (recordings[id]) URL.revokeObjectURL(recordings[id].url);
          const blob = new Blob(chunks, { type: rec.mimeType || 'audio/webm' });
          recordings[id] = { blob, url: URL.createObjectURL(blob) };
          if (flat[idx].id === id) renderRecording();
        }
        resolve();
      };
    });
    try { rec.start(); } catch { recorder = null; recStop = null; }
  }

  function stopRecording() {
    const rec = recorder;
    recorder = null;
    if (rec && rec.state !== 'inactive') rec.stop();
    else recStop = null;
  }

  /* ───────── 진행 ───────── */

  async function start() {
    const q = flat[idx];
    wakeOn();
    stopAll();
    const my = runId;
    phase = 'playing'; render();
    setStatus('듣는 중…');
    try {
      if (!(await playSegments(q.pre, my))) return;
      if (!(await playSegments(q.body, my))) return;
    } catch (e) { setStatus(e.message); phase = 'idle'; render(); return; }
    answer(my);
  }

  async function sayAgain() {
    const q = flat[idx];
    if (sayAgainUsed[q.id]) return;
    sayAgainUsed[q.id] = true; store.set('sayagain', sayAgainUsed);
    wakeOn();
    stopAll();
    const my = runId;
    phase = 'playing'; render();
    setStatus('Say again — 다시 듣는 중…');
    try {
      if (!(await playSegments(q.body, my))) return;
    } catch (e) { setStatus(e.message); phase = 'idle'; render(); return; }
    answer(my);
  }

  function answer(my) {
    const q = flat[idx];
    phase = 'answering'; render();
    setStatus((opts.speech ? '응답하세요 — 말하면 글자로 들어갑니다' : '응답하세요 — 타이핑')
      + (opts.audio ? ' · 녹음 중' : ''));
    // 인식이 마이크를 먼저 잡게 하고, 녹음을 뒤에 붙인다 (동시에 열면 인식이 밀린다)
    startSpeech(q.id);
    setTimeout(() => { if (my === runId) startRecording(q.id); }, 400);
    const total = q.seconds * 1000, t0 = Date.now();
    const tick = () => {
      if (my !== runId) return;
      const left = Math.max(0, total - (Date.now() - t0));
      setTimer(left / 1000, q.seconds);
      if (left <= 0) finish(true);
    };
    tick();
    timerHandle = setInterval(tick, 200);
  }

  async function finish(timeUp) {
    const q = flat[idx];
    stopAll();
    if (timeUp) beep();
    phase = 'done'; revealed = true;
    render();
    setStatus(timeUp ? '시간 종료' : '응답 종료');

    // 녹음 파일이 다 만들어질 때까지 기다린다 (최대 3초)
    const pending = recStop;
    recStop = null;
    if (pending) await Promise.race([pending, wait(3000)]);
    // 음성 인식의 마지막 조각이 들어올 시간
    await wait(400);

    if (opts.speech && !recogFinal.trim()) {
      setStatus(
        speechError ? `${speechError} — 답안이 비었습니다. 타이핑해 주세요.`
        : !SR ? '이 브라우저는 음성 인식을 지원하지 않습니다 — 타이핑해 주세요.'
        : !speechStarted ? '음성 인식이 시작되지 않았습니다 — 녹음 저장을 끄고 다시 해보세요.'
        : '음성 인식이 아무 말도 못 들었습니다 — 마이크에 가까이, 또는 타이핑해 주세요.');
    }
    submit(q);
  }

  /* ───────── 서버 전송 ───────── */

  // 아직 서버에 안 보낸 내용이 있는지
  function dirty(id) {
    const text = (answers[id] || '').trim();
    if (text && text !== lastSent[id]) return true;
    return !!(recordings[id]?.blob && !sentAudio[id]);
  }

  async function submit(q, { keepalive = false } = {}) {
    if (!token) return false;           // 주소에 #k=... 가 없으면 로컬에만 남는다
    if (!dirty(q.id)) return true;      // 이미 보낸 그대로면 다시 보내지 않는다

    const text = (answers[q.id] || '').trim();
    const blob = sentAudio[q.id] ? null : recordings[q.id]?.blob;
    if (!text && !blob) return true;

    sent[q.id] = '보내는 중…'; renderSent();
    const body = {
      set: DATA.set, session, qid: q.id,
      answer: text, seconds: q.seconds, hints: q.hints || [],
    };
    // 페이지가 닫히는 중이면 녹음은 포기하고 글자만 확실히 보낸다
    if (blob && !keepalive) {
      body.mime = blob.type || 'audio/webm';
      body.audio = await toBase64(blob);
    }
    try {
      const r = await fetch('/api/submit', {
        method: 'POST',
        headers: { 'content-type': 'application/json', 'x-epta-token': token },
        body: JSON.stringify(body),
        keepalive,
      });
      const j = await r.json().catch(() => ({}));
      if (r.ok) {
        lastSent[q.id] = text;
        if (body.audio) sentAudio[q.id] = true;
        sent[q.id] = body.audio ? '저장됨 · 녹음 포함' : '저장됨';

        const said = (j.transcript || '').trim();
        if (said) {
          heard[q.id] = said;
          // 답안칸이 비어 있으면 서버가 알아들은 것으로 채운다
          if (!text) {
            answers[q.id] = said;
            lastSent[q.id] = said;       // 방금 서버에서 온 것이니 다시 보낼 필요 없다
            store.set('answers', answers);
            if (flat[idx].id === q.id) { const ta = $('answer'); if (ta) ta.value = said; }
            renderNav();
          }
          if (flat[idx].id === q.id) renderHeard();
        }
        if (j.sttError && flat[idx].id === q.id) {
          setStatus('녹음은 저장됐지만 서버 전사에 실패했습니다: ' + j.sttError);
        }
      } else {
        sent[q.id] = `저장 실패 (${j.error || r.status})`;
      }
      renderSent();
      return r.ok;
    } catch {
      sent[q.id] = '저장 실패 — 네트워크';
      renderSent();
      return false;
    }
  }

  // 타이핑이 멈추면 조금 뒤에 저장한다
  function queueSubmit(q) {
    clearTimeout(typeTimer);
    typeTimer = setTimeout(() => submit(q), 1500);
  }

  // 남은 것 전부 — 화면을 떠날 때, 그리고 버튼을 눌렀을 때
  async function flushAll(opts2 = {}) {
    const todo = flat.filter((q) => dirty(q.id));
    if (!todo.length) return { ok: 0, fail: 0, todo: 0 };
    let ok = 0;
    for (const q of todo) ok += (await submit(q, opts2)) ? 1 : 0;
    return { ok, fail: todo.length - ok, todo: todo.length };
  }

  function toBase64(blob) {
    return new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onload = () => resolve(String(fr.result).split(',')[1]);
      fr.onerror = reject;
      fr.readAsDataURL(blob);
    });
  }

  function renderHeard() {
    const box = $('heard'); if (!box) return;
    const said = heard[flat[idx].id];
    if (!said) { box.innerHTML = ''; return; }
    const same = said === (answers[flat[idx].id] || '').trim();
    box.innerHTML = `<b>녹음에서 알아들은 말 (서버)</b>${esc(said)}`
      + (same ? '' : `<button class="btn use" id="useHeard">이걸 답안으로</button>`);
    $('useHeard')?.addEventListener('click', () => {
      const q = flat[idx];
      answers[q.id] = said;
      store.set('answers', answers);
      const ta = $('answer'); if (ta) ta.value = said;
      renderNav(); renderHeard();
      submit(q);
    });
  }

  function renderSent() {
    const el = $('sent'); if (!el) return;
    const s = sent[flat[idx].id] || '';
    el.textContent = s;
    el.className = 'sent' + (s.startsWith('저장됨') ? ' ok' : s.startsWith('저장 실패') ? ' bad' : '');
  }

  function go(to) {
    if (to < 0 || to >= flat.length) return;
    clearTimeout(typeTimer);
    submit(flat[idx]);                  // 떠나기 전에 지금 문항을 저장한다
    stopAll();
    idx = to; store.set('idx', idx);
    phase = 'idle'; revealed = false;
    render();
    window.scrollTo({ top: 0 });
    if (opts.autoStart) start();
  }

  /* ───────── 화면 ───────── */

  function segHtml(seg) {
    const show = opts.script || revealed;
    if (seg.type === 'chime') return `<div class="seg chime">🔔 dingdong</div>`;
    if (seg.type === 'screen') return `<div class="cue">☞ ${esc(seg.text)}</div>`;
    if (seg.type === 'image') return `<img class="fig" src="${esc(seg.src)}" alt="">`;
    if (seg.kind === 'instruction') return `<div class="seg instruction" data-src="${seg.src}">☞ ${esc(seg.text)}</div>`;
    if (seg.voice === 'atc') {
      return show
        ? `<div class="seg atc" data-src="${seg.src}"><b>${esc(seg.label)} :</b> ${esc(seg.text)}</div>`
        : `<div class="seg atc hidden" data-src="${seg.src}"><b>${esc(seg.label)} :</b> 🔊 (음성)</div>`;
    }
    const tag = /^(Flight Paths|Initial Situation|Situation Update)\.?\s*/.exec(seg.text || '');
    const body = tag ? seg.text.slice(tag[0].length) : (seg.text || '');
    const head = tag ? `<span class="tag">[${esc(tag[1])}]</span> ` : '';
    return show
      ? `<div class="seg narration" data-src="${seg.src}">${head}${esc(body)}</div>`
      : `<div class="seg narration hidden" data-src="${seg.src}">🔊 상황 설명 (음성)</div>`;
  }

  function render() {
    const q = flat[idx], sec = DATA.sections[q.si];
    const model = (DATA.answers || {})[q.id];
    const used = !!sayAgainUsed[q.id];

    $('title').textContent = DATA.set;
    $('progress').textContent = `${idx + 1} / ${flat.length}`;

    // 실제 시험처럼 화면 클루(☞)는 본문에서 빼서 맨 위 띠에 모아 보여준다
    const isCue = (s) => s.type === 'screen';
    const cues = [...q.pre, ...q.body].filter(isCue);
    const pre = q.pre.filter((s) => !isCue(s));
    const body = q.body.filter((s) => !isCue(s));

    $('card').innerHTML = `
      <div class="sec-title">${esc(sec.title)}</div>
      ${q.first && sec.directions ? `<details class="dir"${phase === 'idle' ? ' open' : ''}><summary>Directions</summary>${esc(sec.directions)}</details>` : ''}
      ${cues.length ? `<div class="cuebar">${cues.map(segHtml).join('')}</div>` : ''}
      ${pre.length ? `<div class="pre-label">SITUATION</div><div class="block">${pre.map(segHtml).join('')}</div>` : ''}
      <div class="qhead"><h2>${esc(q.id)}</h2><span class="time">🎙 ${q.seconds}초 ${esc(q.note)}</span></div>
      <div class="block">${body.map(segHtml).join('')}</div>

      <div class="controls">
        ${phase === 'playing' || phase === 'answering'
          ? `<button class="btn" id="stop">■ ${phase === 'answering' ? '응답 끝' : '멈춤'}</button>`
          : `<button class="btn primary" id="start">▶ ${phase === 'done' ? '처음부터 다시' : '시작'}</button>`}
        <button class="btn" id="again" ${used || phase === 'idle' || phase === 'playing' ? 'disabled' : ''}>Say again ${used ? '(사용함)' : '(1회)'}</button>
        <div class="timer"><div class="bar" id="bar"><div></div></div><span id="left">${q.seconds}s</span></div>
      </div>
      <div class="status" id="status"></div>

      <textarea id="answer" placeholder="말하면 여기에 바로 들어옵니다. 말할 수 없는 상황이면 직접 타이핑하세요.">${esc(answers[q.id] || '')}</textarea>
      <div class="live" id="live"></div>
      <div class="heard" id="heard"></div>
      <div class="rec" id="rec"></div>

      ${model ? `<details class="model"><summary>모범답안 보기</summary>${esc(model)}</details>` : ''}

      <div class="nav-row">
        <button class="btn" id="prev" ${idx === 0 ? 'disabled' : ''}>← 이전</button>
        <button class="btn" id="next" ${idx === flat.length - 1 ? 'disabled' : ''}>다음 →</button>
      </div>`;

    $('start')?.addEventListener('click', start);
    $('stop')?.addEventListener('click', () => (phase === 'answering' ? finish(false) : (stopAll(), phase = 'idle', render())));
    $('again').addEventListener('click', sayAgain);
    $('prev').addEventListener('click', () => go(idx - 1));
    $('next').addEventListener('click', () => go(idx + 1));
    $('answer').addEventListener('input', (e) => {
      answers[q.id] = e.target.value; store.set('answers', answers); renderNav();
      queueSubmit(q);
    });
    renderRecording();
    renderHeard();
    renderNav();
  }


  function renderRecording() {
    const rec = recordings[flat[idx].id];
    const box = $('rec'); if (!box) return;
    box.innerHTML = (rec
      ? `내 녹음 <audio controls src="${rec.url}"></audio> <a href="${rec.url}" download="${DATA.set}_${flat[idx].id}.webm">저장</a> `
      : '') + `<span class="sent" id="sent"></span>`;
    renderSent();
  }

  function renderNav() {
    let html = '', lastSec = -1;
    flat.forEach((q, i) => {
      if (q.si !== lastSec) {
        if (lastSec !== -1) html += '</div>';
        html += `<div class="sec">${esc(DATA.sections[q.si].title.replace(/\..*$/, ''))}</div><div class="chips">`;
        lastSec = q.si;
      }
      const cls = [(answers[q.id] || '').trim() ? 'answered' : '', i === idx ? 'current' : ''].join(' ');
      html += `<button class="${cls}" data-i="${i}">${esc(q.id.split('-')[1])}</button>`;
    });
    $('nav').innerHTML = html + '</div>';
    $('nav').querySelectorAll('button').forEach((b) => b.addEventListener('click', () => go(+b.dataset.i)));
  }

  function setTimer(left, total) {
    const bar = $('bar'); if (!bar) return;
    bar.firstElementChild.style.width = `${(1 - left / total) * 100}%`;
    bar.classList.toggle('low', left <= 5);
    $('left').textContent = `${Math.ceil(left)}s`;
  }
  const setStatus = (msg) => { const s = $('status'); if (s) s.textContent = msg; };

  /* ───────── md 내보내기 ───────── */

  function filledMarkdown() {
    const out = [];
    let cur = null, skipping = false;
    for (const line of DATA.raw.split(/\r?\n/)) {
      const m = line.trim().match(/^\*\*(P\d[ABC]-Q\d+)\*\*/);
      if (m) cur = m[1];
      if (skipping) {
        if (line.trim() === '---') { out.push('', line); skipping = false; }
        continue;
      }
      out.push(line);
      if (line.trim() === '[정답]' && cur && (answers[cur] || '').trim()) {
        out.push(answers[cur].trim());
        skipping = true;
      }
    }
    return out.join('\n');
  }

  $('copyMd').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(filledMarkdown()); $('footStatus').textContent = '복사했습니다.'; }
    catch { $('footStatus').textContent = '복사 실패 — md 다운로드를 쓰세요.'; }
  });
  $('downloadMd').addEventListener('click', () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([filledMarkdown()], { type: 'text/markdown' }));
    a.download = `${DATA.set}.md`;
    a.click();
  });
  $('reset').addEventListener('click', () => {
    if (!confirm('이 세트의 답안과 Say again 기록을 지울까요?')) return;
    for (const k of Object.keys(answers)) delete answers[k];
    for (const k of Object.keys(sayAgainUsed)) delete sayAgainUsed[k];
    for (const k of Object.keys(sent)) delete sent[k];
    store.set('answers', answers); store.set('sayagain', sayAgainUsed);
    session = stamp(); store.set('session', session);
    go(0);
  });

  /* ───────── 이탈 시 저장 ───────── */

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      clearTimeout(typeTimer); flushAll({ keepalive: true });
      wakeOff({ keep: true });          // OS 가 이미 풀었을 수 있다 — 상태만 남겨 둔다
    } else if (wakeWanted) {
      wakeOn();                         // 돌아왔으면 다시 잡는다
    }
  });
  window.addEventListener('pagehide', () => {
    clearTimeout(typeTimer); flushAll({ keepalive: true });
    wakeOff();
  });

  $('syncAll').addEventListener('click', async () => {
    if (!token) {
      $('footStatus').textContent = '비밀키가 없어 서버로 못 보냅니다 — md 다운로드를 쓰세요.';
      return;
    }
    clearTimeout(typeTimer);
    $('footStatus').textContent = '보내는 중…';
    const { ok, fail, todo } = await flushAll();
    $('footStatus').textContent = todo === 0
      ? '보낼 것이 없습니다 (모두 저장됨).'
      : `${ok}문항 저장${fail ? `, ${fail}문항 실패` : ''}`;
  });

  function showKeyState() {
    $('nokey').hidden = !!token;
  }
  showKeyState();
  $('mineLink').href = '/r/?set=' + encodeURIComponent(DATA.set);

  $('relogin').addEventListener('click', () => {
    window.eptaForget();
    window.eptaGate((tok) => {
      token = tok;
      showKeyState();
      $('footStatus').textContent = '로그인했습니다. 이제 서버로 보낼 수 있습니다.';
      flushAll();                       // 그동안 못 보낸 답안을 올린다
    });
  });

  // 들어올 때 비밀번호를 확인하고 키를 받는다
  window.eptaGate((tok) => {
    token = tok;
    showKeyState();
    flushAll();                         // 로컬에만 남아 있던 답안이 있으면 올린다
  });

  /* ───────── 옵션 ───────── */

  const bindOpt = (id, name) => {
    $(id).checked = opts[name];
    $(id).addEventListener('change', (e) => { opts[name] = e.target.checked; store.set('opts', opts); render(); });
  };
  bindOpt('optScript', 'script');
  bindOpt('optSpeech', 'speech');
  bindOpt('optAudio', 'audio');
  bindOpt('optAutoStart', 'autoStart');

  $('optWake').checked = opts.wake;
  $('optWake').addEventListener('change', (e) => {
    opts.wake = e.target.checked; store.set('opts', opts);
    if (opts.wake) { if (wakeWanted) wakeOn(); } else wakeOff();
  });
  if (!wakeSupported) {
    $('optWake').checked = false;
    $('optWake').disabled = true;
    $('optWakeLabel').title = '이 브라우저는 화면 켜두기(Screen Wake Lock)를 지원하지 않습니다 — '
      + 'iOS 는 16.4 이상, 설정 ▸ 디스플레이 ▸ 자동 잠금을 길게 두세요.';
  }

  render();
})();
</script>
</body>
</html>
