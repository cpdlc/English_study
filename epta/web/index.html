<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EPTA 연습</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --text:#1d2330; --muted:#6b7384; --line:#e2e5ea;
          --accent:#2459d6; --accent-soft:#e6edfc; --ok:#2e8b57; --warn:#b4531c;
          --atc:#0f7a55; --atc-soft:#e3f4ec; --screen:#111827; --screen-text:#7df9c1; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg:#12151b; --card:#1b2029; --text:#e6e9ef; --muted:#939bab; --line:#2c3340;
    --accent:#6d9bff; --accent-soft:#1f2a44; --ok:#5fcf8c; --warn:#f09a62;
    --atc:#4fd19a; --atc-soft:#183229; --screen:#0a0d12; --screen-text:#7df9c1; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); padding:0 16px;
         font:16px/1.6 system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif; }
  main { max-width:660px; margin:24px auto 60px; }
  h1 { font-size:21px; margin:0 0 4px; }
  p.sub { color:var(--muted); font-size:14px; margin:0 0 20px; }
  a.back { color:var(--accent); font-size:14px; text-decoration:none; }
  .note { margin-top:24px; font-size:13px; color:var(--muted); }
  .lock { margin-top:20px; font-size:13px; color:var(--muted); background:none; border:0;
          padding:0; cursor:pointer; text-decoration:underline; font-family:inherit; }
  button.btn { border:1px solid var(--line); background:var(--card); color:var(--text);
               padding:6px 12px; border-radius:8px; cursor:pointer; font:inherit;
               font-size:13px; }
  button.btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.btn:disabled { opacity:.45; cursor:default; }

  .sets { display:grid; gap:12px; }
  .set { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px; }
  .set .row { display:flex; align-items:baseline; gap:10px; }
  .set .name { font-size:19px; font-weight:700; }
  .set .id { font-size:12px; color:var(--muted); }
  .set .acts { display:flex; gap:8px; margin-top:12px; }
  .set a { flex:1; text-align:center; text-decoration:none; border:1px solid var(--line);
           border-radius:8px; padding:10px; font-size:15px; color:var(--text); }
  .set a.go { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  .empty { color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>EPTA 항공영어구술능력시험 연습</h1>
  <p class="sub">콜사인은 항상 HL123. 말하면 음성 인식으로 글자가 바로 들어옵니다.</p>
  <div class="sets">
    <div class="set">
      <div class="row"><span class="name">Test 1</span><span class="id">EPTA_01</span></div>
      <div class="acts">
        <a class="go" href="/s/EPTA_01/">풀기</a>
        <a href="/r/?set=EPTA_01">내 답안 보기</a>
      </div>
    </div>
    <div class="set">
      <div class="row"><span class="name">Test 2</span><span class="id">EPTA_02</span></div>
      <div class="acts">
        <a class="go" href="/s/EPTA_02/">풀기</a>
        <a href="/r/?set=EPTA_02">내 답안 보기</a>
      </div>
    </div>
  </div>
  <p class="note">응답은 문항마다 서버에 저장됩니다. <b>내 답안 보기</b>에서 문제를 다시 듣고
     내 답안과 정답을 나란히 볼 수 있습니다.</p>
  <button class="lock" id="lock">이 기기에서 로그아웃</button>
</main>
<script src="/gate.js"></script>
<script>
  window.eptaGate(function () {});
  document.getElementById('lock').addEventListener('click', function () {
    window.eptaForget();
    location.reload();
  });
</script>
</body>
</html>
