<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect x="0" y="0" width="400" height="300" fill="#e9edf1"/>

  <!-- taxiway Alpha -->
  <rect x="0" y="60" width="400" height="24" fill="#b9bec4"/>
  <text x="10" y="56" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Taxiway Alpha</text>

  <!-- taxiway Charlie - closed -->
  <rect x="150" y="84" width="24" height="120" fill="#f6c6c6"/>
  <text x="184" y="150" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#b23030">Taxiway Charlie</text>
  <text x="184" y="172" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#b23030">CLOSED</text>
  <line x1="150" y1="84" x2="174" y2="204" stroke="#b23030" stroke-width="4"/>
  <line x1="174" y1="84" x2="150" y2="204" stroke="#b23030" stroke-width="4"/>

  <!-- taxiway Delta - open, alternate -->
  <rect x="260" y="84" width="24" height="120" fill="#cdeccd"/>
  <text x="294" y="150" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2f7d32">Taxiway Delta</text>
  <text x="294" y="172" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2f7d32">USE THIS</text>

  <!-- runway 18 -->
  <rect x="0" y="204" width="400" height="30" fill="#8a8f95"/>
  <text x="10" y="248" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#333">Runway 18</text>

  <!-- HL123 position on Alpha -->
  <rect x="60" y="40" width="70" height="18" fill="#274b8f"/>
  <text x="95" y="54" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff">HL123</text>
  <line x1="95" y1="60" x2="95" y2="84" stroke="#274b8f" stroke-width="4"/>
  <polygon points="95,98 86,80 104,80" fill="#274b8f"/>
</svg>
