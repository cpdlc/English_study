<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
  <rect x="0" y="0" width="400" height="260" fill="#1c2733"/>
  <text x="200" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#e6e9ee">COCKPIT</text>

  <!-- hazy smoke effect -->
  <ellipse cx="140" cy="120" rx="70" ry="40" fill="#8a8f95" opacity="0.5"/>
  <ellipse cx="220" cy="140" rx="90" ry="50" fill="#8a8f95" opacity="0.4"/>
  <ellipse cx="180" cy="100" rx="60" ry="35" fill="#8a8f95" opacity="0.45"/>

  <!-- instrument panel silhouette -->
  <rect x="60" y="160" width="280" height="50" fill="#0f1720" stroke="#4a5561" stroke-width="2"/>
  <circle cx="110" cy="185" r="18" fill="#2a3542" stroke="#6b7684" stroke-width="2"/>
  <circle cx="200" cy="185" r="18" fill="#2a3542" stroke="#6b7684" stroke-width="2"/>
  <circle cx="290" cy="185" r="18" fill="#2a3542" stroke="#6b7684" stroke-width="2"/>

  <text x="200" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#f5b7b1">SMOKE / HAZE DETECTED</text>
</svg>
