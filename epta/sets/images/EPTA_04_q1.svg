<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" width="660" height="360" font-family="Arial, Helvetica, sans-serif">
  <rect width="660" height="360" fill="#ffffff"/>
  <text x="20" y="34" font-size="20" font-weight="bold" fill="#1d2330">ND — DIVERSION OPTIONS</text>

  <!-- track ahead to Halston -->
  <line x1="120" y1="190" x2="580" y2="190" stroke="#c9ced6" stroke-width="3" stroke-dasharray="10 8"/>
  <g fill="#6b7384"><path d="M 580 190 l 10 -10 l 10 10 l -10 10 z"/></g>
  <text x="520" y="172" font-size="19" font-weight="bold" fill="#6b7384">HALSTON</text>
  <text x="520" y="222" font-size="18" fill="#6b7384">140 NM ahead</text>

  <!-- track to Redwood -->
  <line x1="120" y1="190" x2="400" y2="310" stroke="#2459d6" stroke-width="4"/>
  <g fill="#2459d6"><path d="M 400 310 l 10 -10 l 10 10 l -10 10 z"/></g>
  <text x="396" y="300" font-size="19" font-weight="bold" fill="#2459d6">REDWOOD</text>
  <text x="396" y="348" font-size="18" fill="#2459d6">60 NM south-east</text>
  <text x="396" y="328" font-size="17" fill="#2459d6">RWY 26 — 2,600 m</text>

  <!-- own aircraft -->
  <g transform="translate(120,190) rotate(90)">
    <path d="M 0 -16 L 13 14 L 0 7 L -13 14 Z" fill="#1d2330"/>
  </g>
  <text x="56" y="164" font-size="18" font-weight="bold" fill="#1d2330">HL123</text>
  <text x="46" y="144" font-size="17" fill="#6b7384">FL330</text>
</svg>
