<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" font-family="Arial, Helvetica, sans-serif">
  <rect width="680" height="400" fill="#e9e9e9"/>

  <!-- 터미널 (흑백 지상도) -->
  <polygon points="120,60 560,60 560,150 460,150 460,200 120,200" fill="#2b2b2b"/>
  <text x="300" y="120" font-size="20" font-weight="bold" fill="#ffffff">TERMINAL</text>

  <!-- 유도로 Delta (가로) -->
  <rect x="40" y="300" width="600" height="24" fill="#cfcfcf"/>
  <text x="48" y="294" font-size="19" font-weight="bold" fill="#1b1b1b">D</text>

  <!-- 유도로 Mike (세로, stand 24 쪽) -->
  <rect x="250" y="200" width="22" height="100" fill="#cfcfcf"/>
  <text x="278" y="258" font-size="19" font-weight="bold" fill="#1b1b1b">M</text>

  <!-- 주기장 라인 -->
  <line x1="120" y1="200" x2="560" y2="200" stroke="#9a9a9a" stroke-width="3"/>

  <!-- stand 22 (King Air 나오는 중) -->
  <line x1="170" y1="200" x2="170" y2="240" stroke="#9a9a9a" stroke-width="3"/>
  <text x="128" y="226" font-size="16" font-weight="bold" fill="#1b1b1b">22</text>
  <polygon points="170,252 158,268 182,268" fill="#6fb7e3"/>
  <rect x="96" y="276" width="104" height="24" fill="#ffffff" stroke="#1b1b1b" stroke-width="2"/>
  <text x="104" y="294" font-size="15" font-weight="bold" fill="#1b1b1b">KING AIR</text>

  <!-- stand 24 (점유) -->
  <line x1="262" y1="200" x2="262" y2="240" stroke="#9a9a9a" stroke-width="3"/>
  <text x="222" y="226" font-size="16" font-weight="bold" fill="#1b1b1b">24</text>
  <polygon points="262,252 250,268 274,268" fill="#6fb7e3"/>
  <circle cx="262" cy="258" r="26" fill="none" stroke="#c02626" stroke-width="4"/>
  <text x="206" y="178" font-size="17" font-weight="bold" fill="#c02626">OCCUPIED</text>

  <!-- stand 31 (빈 자리, 멀리) -->
  <line x1="520" y1="200" x2="520" y2="240" stroke="#9a9a9a" stroke-width="3"/>
  <text x="536" y="226" font-size="16" font-weight="bold" fill="#1b1b1b">31</text>
  <rect x="470" y="248" width="100" height="26" fill="#ffffff" stroke="#1b1b1b" stroke-width="2"/>
  <text x="478" y="267" font-size="16" font-weight="bold" fill="#1b1b1b">STAND 31</text>

  <!-- 자기 항공기 -->
  <polygon points="190,312 170,302 170,322" fill="#6fb7e3"/>
  <rect x="112" y="340" width="96" height="28" fill="#ffffff" stroke="#1b1b1b" stroke-width="2"/>
  <text x="122" y="360" font-size="18" font-weight="bold" fill="#1b1b1b">HL123</text>
  <line x1="162" y1="340" x2="176" y2="326" stroke="#c02626" stroke-width="3"/>
  <polygon points="180,320 168,324 174,333" fill="#c02626"/>

  <!-- 묻는 지점 -->
  <text x="330" y="360" font-size="22" font-weight="bold" fill="#c02626">STAND 31 ??</text>
  <text x="330" y="386" font-size="18" font-weight="bold" fill="#c02626">8 more minutes ??</text>
</svg>
