<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="680" height="340" font-family="Arial, Helvetica, sans-serif">
  <rect width="680" height="340" fill="#ffffff"/>
  <text x="20" y="34" font-size="20" font-weight="bold" fill="#1d2330">CABIN</text>

  <!-- 기체 평면 (전방 왼쪽 → 후방 오른쪽) -->
  <path d="M60 112 l40 -26 l400 0 l70 26 l-70 26 l-400 0 z" fill="#eef1f5" stroke="#9aa3b0" stroke-width="2"/>
  <text x="112" y="119" font-size="14" fill="#6b7384">FWD</text>
  <text x="470" y="119" font-size="14" fill="#6b7384">AFT</text>

  <!-- 후방 갤리 — 연기 발생 지점 -->
  <rect x="474" y="90" width="76" height="44" fill="#fbeee5" stroke="#b4531c" stroke-width="3"/>
  <text x="486" y="118" font-size="14" font-weight="bold" fill="#b4531c">GALLEY</text>
  <circle cx="512" cy="112" r="34" fill="none" stroke="#c02626" stroke-width="4"/>
  <text x="560" y="106" font-size="17" font-weight="bold" fill="#c02626">SMOKE</text>
  <text x="560" y="128" font-size="15" fill="#c02626">not cleared</text>

  <!-- 상태 칸 -->
  <rect x="40" y="186" width="280" height="56" rx="6" fill="#fbeee5" stroke="#b4531c" stroke-width="3"/>
  <text x="56" y="210" font-size="16" fill="#b4531c">AFT GALLEY PWR</text>
  <text x="56" y="232" font-size="19" font-weight="bold" fill="#b4531c">ISOLATED</text>

  <rect x="360" y="186" width="280" height="56" rx="6" fill="#f1f4f8" stroke="#c9ced6" stroke-width="2"/>
  <text x="376" y="210" font-size="16" fill="#6b7384">FIRE WARNING</text>
  <text x="376" y="232" font-size="19" font-weight="bold" fill="#2e8b57">NONE</text>

  <text x="40" y="282" font-size="17" font-weight="bold" fill="#1d2330">NO FIRE INDICATION · CABIN CREW REPORTING · PAX SEATED</text>
  <text x="40" y="314" font-size="19" font-weight="bold" fill="#c02626">Immediate return ??</text>
</svg>
