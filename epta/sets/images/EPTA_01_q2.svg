<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
  <rect x="0" y="0" width="400" height="260" fill="#1c2733"/>
  <text x="200" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#e6e9ee">LANDING GEAR</text>

  <!-- L indicator -->
  <rect x="30" y="60" width="100" height="70" fill="#c0392b" stroke="#fff" stroke-width="2"/>
  <text x="80" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#fff">L</text>
  <text x="80" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#f5b7b1">UNSAFE</text>

  <!-- N indicator -->
  <rect x="150" y="60" width="100" height="70" fill="#1e8449" stroke="#fff" stroke-width="2"/>
  <text x="200" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#fff">N</text>
  <text x="200" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#abebc6">SAFE</text>

  <!-- R indicator -->
  <rect x="270" y="60" width="100" height="70" fill="#1e8449" stroke="#fff" stroke-width="2"/>
  <text x="320" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#fff">R</text>
  <text x="320" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#abebc6">SAFE</text>

  <text x="200" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#cfd6dd">Gear selected DOWN</text>
  <text x="200" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#cfd6dd">Left main gear indication remains red</text>
</svg>
