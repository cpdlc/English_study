<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" font-family="Arial, Helvetica, sans-serif">
  <rect width="640" height="420" fill="#ffffff"/>
  <text x="20" y="34" font-size="20" font-weight="bold" fill="#1d2330">ND — APPROACH RUNWAY 14</text>

  <!-- range arcs -->
  <path d="M 150 330 A 170 170 0 0 1 490 330" fill="none" stroke="#c9ced6" stroke-width="2" stroke-dasharray="8 8"/>
  <path d="M 230 330 A 90 90 0 0 1 410 330" fill="none" stroke="#c9ced6" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="498" y="336" font-size="17" fill="#6b7384">4 NM</text>
  <text x="418" y="336" font-size="17" fill="#6b7384">2 NM</text>

  <!-- final approach track -->
  <line x1="320" y1="330" x2="320" y2="95" stroke="#2459d6" stroke-width="3"/>

  <!-- runway -->
  <rect x="302" y="60" width="36" height="52" fill="#3a4150"/>
  <text x="352" y="82" font-size="22" font-weight="bold" fill="#1d2330">RWY 14</text>

  <!-- traffic -->
  <g transform="translate(320,196)">
    <path d="M 0 -16 L 15 0 L 0 16 L -15 0 Z" fill="#b4531c"/>
  </g>
  <text x="348" y="192" font-size="22" font-weight="bold" fill="#b4531c">E190</text>
  <text x="348" y="218" font-size="21" fill="#b4531c">3.0 NM</text>

  <!-- own aircraft -->
  <g transform="translate(320,330)">
    <path d="M 0 -20 L 16 18 L 0 10 L -16 18 Z" fill="#1d2330"/>
  </g>
  <text x="346" y="344" font-size="22" font-weight="bold" fill="#1d2330">HL123</text>
  <text x="346" y="368" font-size="20" fill="#1d2330">185 KT</text>
</svg>
