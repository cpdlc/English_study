<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" width="660" height="380" font-family="Arial, Helvetica, sans-serif">
  <rect width="660" height="380" fill="#ffffff"/>
  <text x="20" y="34" font-size="20" font-weight="bold" fill="#1d2330">ND — ROUTE</text>

  <defs>
    <pattern id="hatch" width="12" height="12" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#b4531c" stroke-width="4"/>
    </pattern>
  </defs>

  <!-- training area -->
  <rect x="150" y="70" width="210" height="150" fill="url(#hatch)" opacity="0.5"/>
  <rect x="150" y="70" width="210" height="150" fill="none" stroke="#b4531c" stroke-width="3"/>
  <text x="255" y="130" font-size="20" font-weight="bold" fill="#b4531c" text-anchor="middle">TRAINING AREA</text>
  <text x="255" y="160" font-size="20" font-weight="bold" fill="#b4531c" text-anchor="middle">ACTIVE</text>

  <!-- planned route (through the area) -->
  <line x1="80" y1="300" x2="255" y2="145" stroke="#c9ced6" stroke-width="3" stroke-dasharray="10 8"/>
  <line x1="255" y1="145" x2="520" y2="110" stroke="#c9ced6" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="300" y="250" font-size="16" fill="#6b7384">planned</text>

  <!-- re-route -->
  <line x1="80" y1="300" x2="420" y2="300" stroke="#2459d6" stroke-width="4"/>
  <line x1="420" y1="300" x2="520" y2="110" stroke="#2459d6" stroke-width="4"/>

  <!-- fixes -->
  <g fill="#1d2330">
    <path d="M 80 300 l 9 -9 l 9 9 l -9 9 z"/>
    <path d="M 420 300 l 9 -9 l 9 9 l -9 9 z"/>
    <path d="M 520 110 l 9 -9 l 9 9 l -9 9 z"/>
  </g>
  <text x="52" y="336" font-size="19" font-weight="bold" fill="#1d2330">PALDA</text>
  <text x="400" y="336" font-size="19" font-weight="bold" fill="#2459d6">KARBU</text>
  <text x="498" y="92" font-size="19" font-weight="bold" fill="#1d2330">NOSOK</text>

  <!-- own aircraft -->
  <g transform="translate(110,300) rotate(90)">
    <path d="M 0 -15 L 12 13 L 0 6 L -12 13 Z" fill="#1d2330"/>
  </g>
  <text x="96" y="276" font-size="18" font-weight="bold" fill="#1d2330">HL123</text>
  <text x="96" y="256" font-size="17" fill="#6b7384">FL tree 50</text>
</svg>
