<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="Arial, Helvetica, sans-serif">
  <rect width="760" height="420" fill="#f2f2f2"/>

  <!-- 활주로 34 -->
  <rect x="60" y="40" width="640" height="54" fill="#3c3c3c"/>
  <text x="76" y="75" font-size="20" font-weight="bold" fill="#ffffff">RWY 34</text>
  <line x1="150" y1="67" x2="640" y2="67" stroke="#ffffff" stroke-width="3" stroke-dasharray="34 24"/>

  <!-- 유도로 Sierra (활주로와 평행) -->
  <rect x="60" y="150" width="640" height="40" fill="#8d8d8d"/>
  <text x="70" y="177" font-size="19" font-weight="bold" fill="#1d2330">SIERRA</text>

  <!-- 유도로 Mike (Sierra 로 올라붙는 진입로) -->
  <rect x="250" y="190" width="40" height="190" fill="#8d8d8d"/>
  <text x="196" y="330" font-size="19" font-weight="bold" fill="#1d2330">MIKE</text>

  <!-- 유도로 Kilo (우회로) -->
  <rect x="560" y="190" width="40" height="190" fill="#8d8d8d"/>
  <text x="608" y="330" font-size="19" font-weight="bold" fill="#1d2330">KILO</text>
  <rect x="250" y="340" width="350" height="40" fill="#8d8d8d"/>

  <!-- 대기지점 -->
  <rect x="236" y="120" width="68" height="30" fill="#8d8d8d"/>
  <line x1="236" y1="138" x2="304" y2="138" stroke="#f0d000" stroke-width="4"/>
  <rect x="300" y="100" width="92" height="26" rx="4" fill="#ffffff" stroke="#1d2330" stroke-width="2"/>
  <text x="308" y="119" font-size="15" font-weight="bold" fill="#1d2330">DELTA 2</text>

  <rect x="546" y="120" width="68" height="30" fill="#8d8d8d"/>
  <line x1="546" y1="138" x2="614" y2="138" stroke="#f0d000" stroke-width="4"/>
  <rect x="610" y="100" width="92" height="26" rx="4" fill="#ffffff" stroke="#1d2330" stroke-width="2"/>
  <text x="618" y="119" font-size="15" font-weight="bold" fill="#1d2330">DELTA 1</text>

  <!-- 견인 중인 767 — Sierra 위, 앞쪽 -->
  <g fill="#6b7384">
    <path d="M400 170 l40 0 l16 -12 l8 12 l26 0 l-26 10 l-8 12 l-16 -12 l-40 0 z"/>
  </g>
  <rect x="396" y="196" width="150" height="26" rx="4" fill="#ffffff" stroke="#1d2330" stroke-width="2"/>
  <text x="404" y="215" font-size="15" font-weight="bold" fill="#1d2330">767 UNDER TOW</text>

  <!-- HL123 — Mike 위, Sierra 직전 -->
  <g fill="#7ec8f2" stroke="#2459d6" stroke-width="2">
    <path d="M270 300 l0 -44 l-30 -14 l0 -12 l30 8 l0 -26 l-10 -10 l0 -8 l20 6 l20 -6 l0 8 l-10 10 l0 26 l30 -8 l0 12 l-30 14 l0 44 z" transform="translate(0,6)"/>
  </g>
  <rect x="306" y="252" width="104" height="30" rx="4" fill="#ffffff" stroke="#1d2330" stroke-width="2"/>
  <text x="318" y="274" font-size="18" font-weight="bold" fill="#1d2330">HL123</text>
  <line x1="306" y1="267" x2="286" y2="267" stroke="#c02626" stroke-width="4"/>
  <path d="M286 267 l12 -7 l0 14 z" fill="#c02626"/>

  <!-- 묻는 지점 -->
  <circle cx="270" cy="196" r="34" fill="none" stroke="#c02626" stroke-width="4"/>
  <text x="80" y="246" font-size="20" font-weight="bold" fill="#c02626">Position ??</text>
  <text x="80" y="274" font-size="20" font-weight="bold" fill="#c02626">Mike or Sierra ??</text>
