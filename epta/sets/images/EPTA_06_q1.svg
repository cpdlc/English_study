<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" width="660" height="360" font-family="Arial, Helvetica, sans-serif">
  <rect width="660" height="360" fill="#ffffff"/>
  <text x="20" y="34" font-size="20" font-weight="bold" fill="#1d2330">ARLEN — GROUND</text>

  <!-- runway 24 (far, top) -->
  <rect x="40" y="70" width="580" height="40" fill="#3a4150"/>
  <line x1="40" y1="90" x2="620" y2="90" stroke="#ffffff" stroke-width="3" stroke-dasharray="24 18"/>
  <text x="46" y="63" font-size="19" font-weight="bold" fill="#1d2330">06</text>
  <text x="590" y="63" font-size="19" font-weight="bold" fill="#1d2330">24</text>

  <!-- taxiway ALPHA (congested) -->
  <rect x="40" y="145" width="580" height="22" fill="#f1f4f8" stroke="#b4531c" stroke-width="3"/>
  <text x="46" y="138" font-size="19" font-weight="bold" fill="#b4531c">ALPHA</text>
  <text x="200" y="138" font-size="17" font-weight="bold" fill="#b4531c">CONGESTED — 28 MIN</text>
  <circle cx="330" cy="156" r="7" fill="#b4531c"/>
  <circle cx="365" cy="156" r="7" fill="#b4531c"/>
  <circle cx="400" cy="156" r="7" fill="#b4531c"/>
  <circle cx="435" cy="156" r="7" fill="#b4531c"/>

  <!-- taxiway CHARLIE (vertical link) -->
  <rect x="150" y="167" width="22" height="90" fill="#c9ced6"/>
  <text x="182" y="215" font-size="19" font-weight="bold" fill="#2459d6">CHARLIE</text>

  <!-- taxiway FOXTROT to runway 06 end -->
  <rect x="60" y="167" width="22" height="90" fill="#c9ced6"/>
  <text x="18" y="278" font-size="19" font-weight="bold" fill="#2459d6">FOXTROT</text>
  <text x="30" y="300" font-size="17" font-weight="bold" fill="#2459d6">9 MIN</text>

  <!-- apron / gates -->
  <rect x="60" y="257" width="540" height="44" fill="#e8ebef" stroke="#c9ced6" stroke-width="2"/>
  <text x="470" y="285" font-size="18" fill="#6b7384" text-anchor="middle">APRON — GATES BRAVO</text>

  <!-- own aircraft at Gate Bravo 4 -->
  <polygon points="250,279 232,290 232,268" fill="#1d2330"/>
  <text x="258" y="285" font-size="19" font-weight="bold" fill="#1d2330">HL123 — GATE BRAVO 4</text>

  <text x="20" y="336" font-size="17" fill="#6b7384">SLOT 1340 · TIME NOW 1318</text>
</svg>
