<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect x="0" y="0" width="400" height="300" fill="#e9edf1"/>
  <text x="200" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#333">TAXIWAY INTERSECTION</text>

  <!-- taxiway golf (vertical) -->
  <rect x="180" y="50" width="30" height="220" fill="#b9bec4"/>
  <text x="150" y="65" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Golf</text>

  <!-- taxiway hotel (diagonal branch) -->
  <rect x="180" y="180" width="140" height="26" fill="#b9bec4" transform="rotate(15 250 193)"/>
  <text x="300" y="230" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Hotel</text>

  <!-- HL123 -->
  <rect x="150" y="90" width="70" height="18" fill="#274b8f"/>
  <text x="185" y="103" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff">HL123</text>
  <line x1="195" y1="108" x2="195" y2="150" stroke="#274b8f" stroke-width="4"/>
  <polygon points="195,163 186,146 204,146" fill="#274b8f"/>

  <!-- Gulfstream, blown tire, blocking -->
  <rect x="150" y="180" width="90" height="18" fill="#b23030"/>
  <text x="195" y="193" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">GULFSTREAM (tire)</text>
  <circle cx="230" cy="199" r="10" fill="none" stroke="#b23030" stroke-width="3"/>

  <text x="200" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#b23030">WINGTIP CLEARANCE?</text>
</svg>
