<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" width="660" height="340" font-family="Arial, Helvetica, sans-serif">
  <rect width="660" height="340" fill="#ffffff"/>
  <text x="20" y="34" font-size="20" font-weight="bold" fill="#1d2330">FUEL</text>

  <!-- LEFT 탱크 — 누출 -->
  <rect x="40" y="62" width="250" height="150" rx="6" fill="#fbeee5" stroke="#b4531c" stroke-width="3"/>
  <text x="56" y="92" font-size="19" font-weight="bold" fill="#b4531c">LEFT</text>
  <text x="56" y="146" font-size="34" font-weight="bold" fill="#b4531c">900</text>
  <text x="160" y="146" font-size="18" fill="#6b7384">KG</text>
  <text x="56" y="188" font-size="18" font-weight="bold" fill="#b4531c">FALLING</text>

  <!-- RIGHT 탱크 — 정상 -->
  <rect x="330" y="62" width="250" height="150" rx="6" fill="#f1f4f8" stroke="#c9ced6" stroke-width="2"/>
  <text x="346" y="92" font-size="19" font-weight="bold" fill="#1d2330">RIGHT</text>
  <text x="346" y="146" font-size="34" font-weight="bold" fill="#1d2330">2,100</text>
  <text x="470" y="146" font-size="18" fill="#6b7384">KG</text>
  <text x="346" y="188" font-size="18" font-weight="bold" fill="#2e8b57">STEADY</text>

  <!-- 크로스피드 -->
  <rect x="40" y="226" width="250" height="40" rx="6" fill="#f1f4f8" stroke="#c9ced6" stroke-width="2"/>
  <text x="56" y="253" font-size="17" fill="#6b7384">CROSSFEED</text>
  <text x="196" y="253" font-size="18" font-weight="bold" fill="#1d2330">CLOSED</text>

  <!-- 총량 -->
  <rect x="330" y="226" width="250" height="40" rx="6" fill="#f1f4f8" stroke="#c9ced6" stroke-width="2"/>
  <text x="346" y="253" font-size="17" fill="#6b7384">TOTAL</text>
  <text x="470" y="253" font-size="18" font-weight="bold" fill="#1d2330">3,000 KG</text>

  <!-- 상태 요약 -->
  <text x="40" y="300" font-size="18" font-weight="bold" fill="#1d2330">NO FIRE · 55 MINUTES REMAINING · LDG DIST REQ 2,200 M</text>
  <text x="40" y="328" font-size="19" font-weight="bold" fill="#c02626">Left wing ??</text>
